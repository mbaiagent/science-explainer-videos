<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPC 原理：像调本地方法一样调远程服务 · 拾星</title>
<style>
  :root{--bg:#07080f;--fg:#f4ede4;--muted:#9a93a8;--acc:#c4b5fd}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
  #stage{display:block;background:#07080f;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);cursor:pointer}
  #bar{display:flex;align-items:center;gap:12px;width:min(calc(100vw - 32px),640px)}
  #btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(196,181,253,.5);background:transparent;
    color:var(--acc);font-size:16px;cursor:pointer;flex:none}
  #seek{flex:1;accent-color:var(--acc)}
  #time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:84px;text-align:right}
  body.render{display:block}
  body.render #bar{display:none}
  body.render #stage{border-radius:0;box-shadow:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bar">
  <button id="btn" aria-label="播放/暂停">❚❚</button>
  <input id="seek" type="range" min="0" max="84" step="0.01" value="0">
  <span id="time">0:00 / 1:24</span>
</div>
<script>
/* ============ 基础设置（横屏 1920×1080） ============ */
const W = 1920, H = 1080, DUR = 84;
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const FONT = '"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif';
const MONO = '"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono CJK SC","PingFang SC","Microsoft YaHei",monospace';
const C = {acc:'#c4b5fd', mint:'#6ee7c8', gold:'#ffd38a', coral:'#ff9e7a', rose:'#ff8a8a', blue:'#9cc3ff', text:'#f4ede4', muted:'#9a93a8', dim:'#4a4558', panel:'#0f0e1f'};

const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const p = (t,a,b) => clamp((t-a)/(b-a));
const eo = x => 1 - Math.pow(1-x, 3);
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const eback = x => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
function rnd(seed){ let s = seed>>>0; return () => { s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }

let SA = 1;
const al = a => { ctx.globalAlpha = clamp(SA*a); };
const sceneA = (t,a,b,f=.5) => Math.min(p(t,a,a+f), 1 - p(t,b-f,b));

function txt(s, x, y, o = {}){
  const {size=64, weight=700, color=C.text, alpha=1, align='center', glow=0, scale=1, font=FONT} = o;
  if (alpha <= 0) return;
  ctx.save(); al(alpha);
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (glow){ ctx.shadowColor = color; ctx.shadowBlur = glow; }
  if (scale !== 1){ ctx.translate(x, y); ctx.scale(scale, scale); ctx.fillText(s, 0, 0); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}
function rise(s, x, y, t, t0, o = {}, d = .7){
  const e = eo(p(t, t0, t0+d));
  if (e <= 0) return;
  txt(s, x, y + (1-e)*36, {...o, alpha:(o.alpha ?? 1)*e});
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function box(x, y, w, h, a, o = {}){
  const {fill='rgba(255,255,255,.05)', stroke='rgba(196,181,253,.35)', lw=2, glow=0, r=18, dash=null} = o;
  if (a <= 0) return;
  ctx.save(); al(a); rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (dash) ctx.setLineDash(dash);
  ctx.strokeStyle = stroke; ctx.lineWidth = lw; if (glow){ ctx.shadowColor = stroke; ctx.shadowBlur = glow; } ctx.stroke(); ctx.restore();
}
function arrow(x1, y1, x2, y2, e, a, color = C.acc, lw = 3){
  if (e <= 0 || a <= 0) return;
  const x = lerp(x1, x2, e), y = lerp(y1, y2, e), ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); al(a); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  if (e > .85){ ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-14, -9); ctx.lineTo(-14, 9); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function panel(x, y, w, h, title, a){
  box(x, y, w, h, a, {fill:C.panel, stroke:'rgba(255,255,255,.1)', r:20});
  if (a <= 0) return;
  ctx.save(); al(a); ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + 52); ctx.lineTo(x + w, y + 52); ctx.stroke();
  ['#ff6b6b','#ffd166','#6ee7a0'].forEach((c, i) => { ctx.fillStyle = c; ctx.globalAlpha = clamp(SA*a*.8); ctx.beginPath(); ctx.arc(x + 30 + i*24, y + 26, 7, 0, 6.283); ctx.fill(); });
  ctx.restore();
  txt(title, x + w/2, y + 27, {size:22, weight:500, color:C.muted, font:MONO, alpha:a});
}

/* ============ 背景 ============ */
const PARTS = (() => { const r = rnd(263); return Array.from({length:100}, () => ({
  x:r()*W, y:r()*H, s:r()*2.2+.5, v:r()*12+4, ph:r()*6.283, c:r()<.25})); })();
function background(t){
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0a0916'); g.addColorStop(.55,'#110f24'); g.addColorStop(1,'#18122c');
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const gx = W*.5 + Math.sin(t*.27)*140;
  const rg = ctx.createRadialGradient(gx, H*.45, 0, gx, H*.45, 950);
  rg.addColorStop(0,'rgba(196,181,253,0.09)'); rg.addColorStop(1,'rgba(196,181,253,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = C.acc;
  for (let x = 40; x < W; x += 80) for (let y = 40; y < H; y += 80){ ctx.globalAlpha = .06; ctx.fillRect(x, y, 2, 2); }
  for (const q of PARTS){
    const y = ((q.y - t*q.v) % H + H) % H, x = q.x + Math.sin(t*.35 + q.ph)*12;
    ctx.globalAlpha = .2 + .3*(.5 + .5*Math.sin(t*1.2 + q.ph));
    ctx.fillStyle = q.c ? C.acc : '#d8d0ff';
    ctx.beginPath(); ctx.arc(x, y, q.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function vignette(){
  const v = ctx.createRadialGradient(W/2, H/2, W*.28, W/2, H/2, W*.62);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.globalAlpha = 1; ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}
function codeLine(s, x, y, size, a, kw = /\b(public|class|static|void|new|return)\b/){
  const parts = s.split(/("[^"]*"|\b(?:public|class|static|void|new|return|getstatic|ldc|invokevirtual)\b)/g);
  ctx.save(); al(a); ctx.font = `500 ${size}px ${MONO}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  let xx = x;
  for (const seg of parts){ if (!seg) continue;
    ctx.fillStyle = seg.startsWith('"') ? C.mint : /^(public|class|static|void|new|return|getstatic|ldc|invokevirtual)$/.test(seg) ? C.acc : C.text;
    ctx.fillText(seg, xx, y); xx += ctx.measureText(seg).width; }
  ctx.restore();
}

function card(h, lines, x, y, w, hh, a, c = C.acc, o = {}){
  const {hs=30, ls=22, lh=40} = o;
  box(x, y, w, hh, a, {fill:'rgba(196,181,253,.05)', stroke:c === C.acc ? 'rgba(196,181,253,.5)' : c, r:20});
  txt(h, x + 30, y + 44, {size:hs, weight:900, color:c, align:'left', alpha:a});
  lines.forEach((s, i) => txt(s, x + 30, y + 96 + i*lh, {size:ls, weight:600, color:'#d9d2e4', align:'left', alpha:a}));
}
function stage(label, sub, cx, cy, w, h, a, on = 0){
  box(cx - w/2, cy - h/2, w, h, a, {fill:on ? 'rgba(196,181,253,.20)' : 'rgba(196,181,253,.07)', stroke:on ? C.acc : 'rgba(196,181,253,.45)', r:18, glow:on ? 22 : 0});
  txt(label, cx, cy - (sub ? 16 : 0), {size:30, weight:900, color:on ? C.acc : C.text, alpha:a});
  if (sub) txt(sub, cx, cy + 26, {size:20, weight:600, color:C.muted, alpha:a});
}
function codeCmt(code, cmt, x, cx, y, size, a){
  codeLine(code, x, y, size, a);
  if (cmt) txt(cmt, cx, y, {size, weight:500, font:MONO, color:C.muted, align:'left', alpha:a});
}
function seg(x, y, w, h, a, fill, stroke, label, lc = C.text){
  box(x, y, w, h, a, {fill, stroke, r:8});
  if (label) txt(label, x + w/2, y + h/2, {size:22, weight:800, font:MONO, color:lc, alpha:a});
}

/* ============ 场景 1 · 钩子 (0–7s) ============ */
function s1(t){
  rise('这行代码，其实在另一台机器上执行', W/2, 110, t, .2, {size:54, weight:900});
  const a = eo(p(t, .8, 1.3));
  panel(120, 210, 800, 300, 'OrderController.java', a);
  txt('// 看起来就是一次普通的方法调用', 160, 300, {size:24, weight:500, font:MONO, color:C.muted, align:'left', alpha:eo(p(t, 1.1, 1.5))});
  codeLine('String r = helloService.hello("拾星");', 160, 370, 28, eo(p(t, 1.4, 1.8)));
  txt('// r = "Hello, 拾星"', 160, 440, {size:24, weight:500, font:MONO, color:C.mint, align:'left', alpha:eo(p(t, 3.4, 3.8))});
  const b = eo(p(t, 1.8, 2.3));
  box(1240, 230, 560, 260, b, {fill:'rgba(196,181,253,.08)', stroke:C.acc, r:22});
  txt('另一台机器', 1520, 290, {size:24, weight:700, color:C.muted, alpha:b});
  txt('HelloServiceImpl', 1520, 360, {size:34, weight:900, font:MONO, color:C.acc, alpha:b});
  txt('hello() 在这里真正执行', 1520, 425, {size:24, weight:700, alpha:b});
  arrow(935, 360, 1225, 360, eo(p(t, 2.2, 2.8)), b, C.acc, 3);
  txt('网络', 1080, 320, {size:24, weight:800, color:C.acc, alpha:eo(p(t, 2.4, 2.8))});
  const k = p(t, 2.6, 3.4);
  if (k > 0 && k < 1){ ctx.save(); al(1); ctx.fillStyle = C.gold; ctx.shadowColor = C.gold; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(lerp(950, 1210, eio(k)), 360, 10, 0, 6.283); ctx.fill(); ctx.restore(); }
  rise('背后藏着这些步骤：', W/2, 580, t, 3.6, {size:26, weight:700, color:C.muted});
  ['动态代理', '序列化', '协议编码', '网络传输', '反射调用'].forEach((s, i) => { const e = eo(p(t, 3.9 + i*.3, 4.3 + i*.3)), x = W/2 + (i - 2)*320;
    box(x - 135, 625, 270, 90, e, {fill:'rgba(196,181,253,.10)', stroke:'rgba(196,181,253,.55)', r:16});
    txt(s, x, 670, {size:30, weight:900, alpha:e});
    if (i) arrow(x - 178, 670, x - 142, 670, e, e, C.acc, 3); });
  rise('RPC：Remote Procedure Call，远程过程调用', W/2, 820, t, 5.3, {size:40, weight:900, color:C.acc});
  rise('目标：调用远程服务，像调用本地方法一样简单', W/2, 905, t, 5.8, {size:30, weight:800, color:C.gold});
}

/* ============ 场景 2 · 完整链路 (7–17s) ============ */
function s2(t){
  rise('一次 RPC 调用的完整旅程', W/2, 90, t, 7.2, {size:54, weight:900});
  const k = p(t, 10.8, 13.6), step = k > 0 && k < 1 ? Math.floor(k*9) : -1;
  txt('客户端', 120, 190, {size:28, weight:900, color:C.gold, align:'left', alpha:eo(p(t, 7.5, 7.9))});
  const top = [['业务代码', 'hello("拾星")'], ['代理 Stub', '拦截方法调用'], ['序列化', '对象 → 字节'], ['协议编码', '加上帧头']];
  top.forEach(([h, d], i) => { const e = eo(p(t, 7.6 + i*.35, 8 + i*.35)), x = 250 + i*360;
    stage(h, d, x, 300, 300, 120, e, step === i);
    if (i) arrow(x - 205, 300, x - 155, 300, e, e, C.acc, 3); });
  const n = eo(p(t, 9, 9.4));
  box(1560, 240, 260, 460, n, {fill:step === 4 ? 'rgba(255,211,138,.16)' : 'rgba(255,211,138,.07)', stroke:C.gold, r:20, glow:step === 4 ? 22 : 0});
  txt('网络', 1690, 440, {size:36, weight:900, color:C.gold, alpha:n}); txt('TCP 连接', 1690, 495, {size:22, weight:700, color:C.muted, alpha:n});
  arrow(1485, 300, 1555, 300, n, n, C.acc, 3);
  arrow(1555, 640, 1485, 640, eo(p(t, 9.35, 9.7)), eo(p(t, 9.35, 9.7)), C.acc, 3);
  const bot = [['协议解码', '按长度切出一帧'], ['反序列化', '字节 → 对象'], ['反射调用', '找到方法并 invoke'], ['实现类', 'HelloServiceImpl']];
  bot.forEach(([h, d], i) => { const e = eo(p(t, 9.35 + i*.35, 9.75 + i*.35)), x = 1330 - i*360;
    stage(h, d, x, 640, 300, 120, e, step === 5 + i);
    if (i) arrow(x + 205, 640, x + 155, 640, e, e, C.acc, 3); });
  rise('调用信息一路被「翻译」：方法调用 → 对象 → 字节 → 网络 → 字节 → 对象 → 方法调用', W/2, 470, t, 10.8, {size:24, weight:700, color:C.muted});
  txt('服务端', 120, 750, {size:28, weight:900, color:C.gold, align:'left', alpha:eo(p(t, 9.6, 10))});
  rise('返回值原路返回：结果序列化 → 编码 → 网络 → 客户端解码 → 反序列化 → 调用方拿到 String', W/2, 840, t, 13.6, {size:26, weight:700, color:C.text});
  rise('框架把这一切藏在接口后面：你只管写接口和实现类', W/2, 920, t, 14.5, {size:32, weight:900, color:C.gold});
}

/* ============ 场景 3 · 动态代理 + 反射 (17–28s) ============ */
function s3(t){
  rise('两端的关键：动态代理 + 反射', W/2, 90, t, 17.2, {size:54, weight:900});
  const a = eo(p(t, 17.6, 18.1));
  panel(100, 170, 860, 640, '客户端：动态代理生成 Stub', a);
  const L = [['hs = Proxy.newProxyInstance(loader,', ''], ['    new Class[]{HelloService.class},', ''], ['    (proxy, method, args) -> {', ''], ['      var req = new RpcRequest(', ''],
             ['          nextId(),', '// 请求 ID'], ['          "HelloService",', '// 接口名'], ['          method.getName(),', '// 方法名'], ['          method.getParameterTypes(),', ''],
             ['          args);', '// 参数'], ['      return client.send(req)', '// 发出去'], ['                   .get(3, SECONDS);', '// 等结果'], ['    });', '']];
  L.forEach(([c, m], i) => codeCmt(c, m, 130, 650, 262 + i*42, 22, eo(p(t, 17.9 + i*.15, 18.3 + i*.15))));
  const b = eo(p(t, 20.8, 21.3));
  panel(1000, 170, 820, 640, '服务端：反射调用实现类', b);
  const R = [['// 启动时：注册实现类', C.muted], ['services.put("HelloService",', 0], ['             new HelloServiceImpl());', 0], ['', 0],
             ['// 收到请求：按名字找实现，反射调用', C.muted], ['Object impl = services.get(req.iface());', 0], ['Method m = impl.getClass().getMethod(', 0],
             ['    req.method(), req.paramTypes());', 0], ['Object result = m.invoke(impl, req.args());', 0], ['', 0], ['send(new RpcResponse(req.id(), result));', 0]];
  R.forEach(([c, col], i) => { const e = eo(p(t, 21.1 + i*.18, 21.5 + i*.18)); if (!c) return;
    if (col) txt(c, 1030, 262 + i*46, {size:22, weight:500, font:MONO, color:col, align:'left', alpha:e}); else codeLine(c, 1030, 262 + i*46, 22, e); });
  rise('调用方以为在调本地方法，其实只是把「调谁、传什么」打包成对象发了出去', W/2, 880, t, 24, {size:28, weight:800, color:C.gold});
  rise('服务端按「接口名 + 方法名 + 参数类型」找到实现并调用，再把结果连同请求 ID 一起送回', W/2, 950, t, 25, {size:24, weight:700, color:C.muted});
}

/* ============ 场景 4 · 序列化 (28–40s) ============ */
function s4(t){
  rise('序列化：对象 ⇄ 字节', W/2, 90, t, 28.2, {size:54, weight:900});
  rise('同一个对象 User{id=150, name="拾星"}，两种编码', W/2, 160, t, 28.6, {size:28, weight:700, color:C.muted});
  const a = eo(p(t, 29.2, 29.7));
  box(120, 220, 800, 210, a, {fill:'rgba(255,255,255,.04)', stroke:'rgba(255,255,255,.25)', r:20});
  txt('JSON（文本）', 160, 262, {size:28, weight:900, color:C.gold, align:'left', alpha:a});
  txt('{"id":150,"name":"拾星"}', 520, 330, {size:30, weight:700, font:MONO, alpha:a});
  txt('带字段名，人能直接看懂 · 共 26 字节', 520, 392, {size:22, weight:700, color:C.muted, alpha:a});
  const b = eo(p(t, 30.2, 30.7));
  box(1000, 220, 800, 210, b, {fill:'rgba(196,181,253,.08)', stroke:C.acc, r:20});
  txt('Protobuf（二进制）', 1040, 262, {size:28, weight:900, color:C.acc, align:'left', alpha:b});
  txt('08 96 01 12 06 e6 8b be e6 98 9f', 1400, 330, {size:30, weight:700, font:MONO, alpha:b});
  txt('只有字段编号 + 值 · 共 11 字节', 1400, 392, {size:22, weight:700, color:C.muted, alpha:b});
  const S = [['JSON', ['文本，可读性最好', '天然跨语言', '体积大、解析较慢', 'HTTP REST 的主流'], C.gold],
             ['Protobuf', ['二进制 + .proto 定义', '跨语言，兼容性好', '体积小、速度快', 'gRPC 默认'], C.acc],
             ['Hessian', ['二进制，自描述', '无需 IDL', '跨语言，Java 生态常用', 'Dubbo 2.x 默认'], C.blue],
             ['Kryo', ['二进制，Java 专用', '速度快、体积小', '最好提前注册类', '不适合跨语言'], C.mint]];
  S.forEach(([h, ls, c], i) => card(h, ls, 120 + i*427, 480, 400, 310, eo(p(t, 31.6 + i*.6, 32.1 + i*.6)), c, {hs:32, lh:46}));
  rise('选型看三点：要不要跨语言、要不要人能读、对性能有多敏感', W/2, 870, t, 35, {size:30, weight:900, color:C.gold});
  rise('JDK 自带的序列化体积大、速度慢，还有反序列化安全风险，不适合跨服务通信', W/2, 945, t, 36.2, {size:24, weight:700, color:C.muted});
}

/* ============ 场景 5 · 协议帧与粘包拆包 (40–53s) ============ */
function s5(t){
  rise('协议：给字节流划出边界', W/2, 90, t, 40.2, {size:54, weight:900});
  rise('TCP 只保证字节按顺序到达，不知道一条消息从哪开始、到哪结束', W/2, 160, t, 40.6, {size:28, weight:700, color:C.muted});
  const cols = [['rgba(196,181,253,.25)', C.acc], ['rgba(255,211,138,.22)', C.gold], ['rgba(110,231,200,.22)', C.mint]];
  txt('发送端写了 3 条消息', 120, 230, {size:24, weight:800, align:'left', alpha:eo(p(t, 41, 41.4))});
  const M = [300, 220, 260]; let x = 120;
  M.forEach((w, i) => { seg(x, 260, w, 60, eo(p(t, 41.2 + i*.3, 41.6 + i*.3)), cols[i][0], cols[i][1], '消息 ' + (i + 1)); x += w + 30; });
  const r = eo(p(t, 42.2, 42.7));
  txt('接收端可能这样读到', 120, 380, {size:24, weight:800, align:'left', alpha:r});

/* ============ 总调度 ============ */
const SCENES = [[s1,-1,7],[s2,7,17],[s3,17,28],[s4,28,40],[s5,40,53],[s6,53,65],[s7,65,78],[s8,78,84]];
function draw(t){
  t = clamp(t, 0, DUR);
  ctx.save(); ctx.globalAlpha = 1; ctx.clearRect(0,0,W,H); background(t);
  for (const [fn,a,b] of SCENES){
    if (t < a || t > b) continue;
    SA = sceneA(t, a, b, b === DUR ? .8 : .5);
    if (SA > 0){ ctx.save(); fn(t); ctx.restore(); }
  }
  SA = 1; vignette();
  const fo = p(t, DUR - .8, DUR);
  if (fo > 0){ ctx.globalAlpha = fo; ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}

/* ============ 播放器 / 逐帧渲染接口 ============ */
const isRender = new URLSearchParams(location.search).has('render');
window.DURATION = DUR;
window.renderFrame = t => draw(t);
const btn = document.getElementById('btn'), seek = document.getElementById('seek'), timeEl = document.getElementById('time');
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function fit(){
  if (isRender){ cv.style.width = W+'px'; cv.style.height = H+'px'; return; }
  const w = Math.min(innerWidth - 32, (innerHeight - 84)*16/9);
  cv.style.width = w + 'px'; cv.style.height = w*9/16 + 'px';
}
addEventListener('resize', fit); fit();

let cur = 0, playing = !isRender, last = null;
function toggle(){ if (cur >= DUR) cur = 0; playing = !playing; }
btn.onclick = toggle; cv.onclick = toggle;
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); toggle(); } });
seek.oninput = () => { cur = +seek.value; draw(cur); };
function loop(ts){
  if (playing && last != null){ cur += (ts - last)/1000; if (cur >= DUR){ cur = DUR; playing = false; } }
  last = ts; draw(cur);
  seek.value = cur; timeEl.textContent = `${fmt(cur)} / ${fmt(DUR)}`;
  btn.textContent = playing ? '❚❚' : (cur >= DUR ? '↺' : '▶');
  requestAnimationFrame(loop);
}
document.fonts.ready.then(() => {
  window.ready = true;
  if (isRender) draw(0); else requestAnimationFrame(loop);
});
</script>
