<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>熔断与降级：防止一个服务拖垮全部 · 拾星</title>
<style>
  :root{--bg:#07080f;--fg:#f4ede4;--muted:#9a93a8;--acc:#fca5a5}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
  #stage{display:block;background:#07080f;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);cursor:pointer}
  #bar{display:flex;align-items:center;gap:12px;width:min(calc(100vw - 32px),640px)}
  #btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(252,165,165,.5);background:transparent;
    color:var(--acc);font-size:16px;cursor:pointer;flex:none}
  #seek{flex:1;accent-color:var(--acc)}
  #time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:84px;text-align:right}
  body.render{display:block}
  body.render #bar{display:none}
  body.render #stage{border-radius:0;box-shadow:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bar">
  <button id="btn" aria-label="播放/暂停">❚❚</button>
  <input id="seek" type="range" min="0" max="84" step="0.01" value="0">
  <span id="time">0:00 / 1:24</span>
</div>
<script>
/* ============ 基础设置（横屏 1920×1080） ============ */
const W = 1920, H = 1080, DUR = 84;
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const FONT = '"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif';
const MONO = '"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono CJK SC","PingFang SC","Microsoft YaHei",monospace';
const C = {acc:'#fca5a5', mint:'#6ee7c8', gold:'#ffd38a', coral:'#ff9e7a', rose:'#ff8a8a', blue:'#9cc3ff', text:'#f4ede4', muted:'#9a93a8', dim:'#4a4558', panel:'#0f0e1f'};

const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const p = (t,a,b) => clamp((t-a)/(b-a));
const eo = x => 1 - Math.pow(1-x, 3);
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const eback = x => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
function rnd(seed){ let s = seed>>>0; return () => { s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }

let SA = 1;
const al = a => { ctx.globalAlpha = clamp(SA*a); };
const sceneA = (t,a,b,f=.5) => Math.min(p(t,a,a+f), 1 - p(t,b-f,b));

function txt(s, x, y, o = {}){
  const {size=64, weight=700, color=C.text, alpha=1, align='center', glow=0, scale=1, font=FONT} = o;
  if (alpha <= 0) return;
  ctx.save(); al(alpha);
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (glow){ ctx.shadowColor = color; ctx.shadowBlur = glow; }
  if (scale !== 1){ ctx.translate(x, y); ctx.scale(scale, scale); ctx.fillText(s, 0, 0); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}
function rise(s, x, y, t, t0, o = {}, d = .7){
  const e = eo(p(t, t0, t0+d));
  if (e <= 0) return;
  txt(s, x, y + (1-e)*36, {...o, alpha:(o.alpha ?? 1)*e});
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function box(x, y, w, h, a, o = {}){
  const {fill='rgba(255,255,255,.05)', stroke='rgba(252,165,165,.35)', lw=2, glow=0, r=18, dash=null} = o;
  if (a <= 0) return;
  ctx.save(); al(a); rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (dash) ctx.setLineDash(dash);
  ctx.strokeStyle = stroke; ctx.lineWidth = lw; if (glow){ ctx.shadowColor = stroke; ctx.shadowBlur = glow; } ctx.stroke(); ctx.restore();
}
function arrow(x1, y1, x2, y2, e, a, color = C.acc, lw = 3){
  if (e <= 0 || a <= 0) return;
  const x = lerp(x1, x2, e), y = lerp(y1, y2, e), ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); al(a); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  if (e > .85){ ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-14, -9); ctx.lineTo(-14, 9); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function panel(x, y, w, h, title, a){
  box(x, y, w, h, a, {fill:C.panel, stroke:'rgba(255,255,255,.1)', r:20});
  if (a <= 0) return;
  ctx.save(); al(a); ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + 52); ctx.lineTo(x + w, y + 52); ctx.stroke();
  ['#ff6b6b','#ffd166','#6ee7a0'].forEach((c, i) => { ctx.fillStyle = c; ctx.globalAlpha = clamp(SA*a*.8); ctx.beginPath(); ctx.arc(x + 30 + i*24, y + 26, 7, 0, 6.283); ctx.fill(); });
  ctx.restore();
  txt(title, x + w/2, y + 27, {size:22, weight:500, color:C.muted, font:MONO, alpha:a});
}

/* ============ 背景 ============ */
const PARTS = (() => { const r = rnd(257); return Array.from({length:100}, () => ({
  x:r()*W, y:r()*H, s:r()*2.2+.5, v:r()*12+4, ph:r()*6.283, c:r()<.25})); })();
function background(t){
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0a0916'); g.addColorStop(.55,'#110f24'); g.addColorStop(1,'#18122c');
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const gx = W*.5 + Math.sin(t*.27)*140;
  const rg = ctx.createRadialGradient(gx, H*.45, 0, gx, H*.45, 950);
  rg.addColorStop(0,'rgba(252,165,165,0.09)'); rg.addColorStop(1,'rgba(252,165,165,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = C.acc;
  for (let x = 40; x < W; x += 80) for (let y = 40; y < H; y += 80){ ctx.globalAlpha = .06; ctx.fillRect(x, y, 2, 2); }
  for (const q of PARTS){
    const y = ((q.y - t*q.v) % H + H) % H, x = q.x + Math.sin(t*.35 + q.ph)*12;
    ctx.globalAlpha = .2 + .3*(.5 + .5*Math.sin(t*1.2 + q.ph));
    ctx.fillStyle = q.c ? C.acc : '#d8d0ff';
    ctx.beginPath(); ctx.arc(x, y, q.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function vignette(){
  const v = ctx.createRadialGradient(W/2, H/2, W*.28, W/2, H/2, W*.62);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.globalAlpha = 1; ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}
function codeLine(s, x, y, size, a, kw = /\b(public|class|static|void|new|return)\b/){
  const parts = s.split(/("[^"]*"|\b(?:public|class|static|void|new|return|getstatic|ldc|invokevirtual)\b)/g);
  ctx.save(); al(a); ctx.font = `500 ${size}px ${MONO}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  let xx = x;
  for (const seg of parts){ if (!seg) continue;
    ctx.fillStyle = seg.startsWith('"') ? C.mint : /^(public|class|static|void|new|return|getstatic|ldc|invokevirtual)$/.test(seg) ? C.acc : C.text;
    ctx.fillText(seg, xx, y); xx += ctx.measureText(seg).width; }
  ctx.restore();
}

function card(h, lines, x, y, w, hh, a, c = C.acc, o = {}){
  const {hs=30, ls=22, lh=40, lc=[]} = o;
  box(x, y, w, hh, a, {fill:'rgba(252,165,165,.05)', stroke:c === C.acc ? 'rgba(252,165,165,.5)' : c, r:20});
  txt(h, x + 30, y + 44, {size:hs, weight:900, color:c, align:'left', alpha:a});
  lines.forEach((s, i) => txt(s, x + 30, y + 96 + i*lh, {size:ls, weight:600, color:lc[i] || '#d9d2e4', align:'left', alpha:a}));
}
function node(label, sub, x, y, w, h, a, c = C.text, bad = 0){
  box(x - w/2, y - h/2, w, h, a, {fill: bad ? 'rgba(255,138,138,' + (.06 + .12*bad) + ')' : 'rgba(255,255,255,.05)', stroke: bad > .5 ? C.rose : 'rgba(255,255,255,.3)', r:20, glow: bad*20});
  txt(label, x, y - (sub ? 16 : 0), {size:32, weight:900, color: bad > .5 ? C.rose : c, alpha:a});
  if (sub) txt(sub, x, y + 28, {size:21, weight:700, color: bad > .5 ? C.rose : C.muted, alpha:a});
}
function slots(x, y, n, cols, filled, a, cw = 40, ch = 30, gap = 8, col = C.rose){
  for (let i = 0; i < n; i++){ const cx = x + (i % cols)*(cw + gap), cy = y + Math.floor(i/cols)*(ch + gap), on = i < filled;
    box(cx, cy, cw, ch, a, {fill: on ? (col === C.rose ? 'rgba(255,138,138,.55)' : col === C.mint ? 'rgba(110,231,200,.45)' : 'rgba(255,211,138,.5)') : 'rgba(255,255,255,.05)', stroke: on ? col : 'rgba(255,255,255,.22)', r:6}); }
}
function dot(x, y, r, a, c){
  if (a <= 0) return;
  ctx.save(); al(a); ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.restore();
}
function ring(x, y, r, a, c, glow, fillA = .08){
  if (a <= 0) return;
  ctx.save(); al(a); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283);
  ctx.fillStyle = c === C.mint ? 'rgba(110,231,200,' + (fillA + .14*glow) + ')' : c === C.rose ? 'rgba(255,138,138,' + (fillA + .14*glow) + ')' : 'rgba(255,211,138,' + (fillA + .14*glow) + ')';
  ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 3 + 3*glow; if (glow > 0){ ctx.shadowColor = c; ctx.shadowBlur = 36*glow; } ctx.stroke(); ctx.restore();
}
function swUI(x, y, on, a){
  if (a <= 0) return;
  box(x, y - 20, 76, 40, a, {fill: on ? 'rgba(110,231,200,.35)' : 'rgba(255,255,255,.08)', stroke: on ? C.mint : 'rgba(255,255,255,.35)', r:20});
  ctx.save(); al(a); ctx.fillStyle = on ? C.mint : C.muted; ctx.beginPath(); ctx.arc(x + (on ? 56 : 20), y, 14, 0, 6.283); ctx.fill(); ctx.restore();
}

/* ============ 场景 1 · 钩子 (0–7s) ============ */
function s1(t){
  rise('一个不重要的服务变慢，整个网站挂了', W/2, 100, t, .2, {size:54, weight:900});
  const a = eo(p(t, .7, 1.2)), slow = eo(p(t, 1.8, 2.2)), full = p(t, 2.4, 4.2);
  const bo = eo(p(t, 4.2, 4.5)), bg = eo(p(t, 4.6, 4.9)), bu = eo(p(t, 5, 5.3));
  node('用户', bu > .5 ? '✗ 页面一直转圈' : '下单', 220, 380, 300, 140, a, C.text, bu);
  node('网关', bg > .5 ? '请求堆积' : '', 700, 380, 300, 140, eo(p(t, .9, 1.4)), C.text, bg);
  node('订单服务', bo > .5 ? '没有空闲线程' : '', 1180, 380, 300, 140, eo(p(t, 1.1, 1.6)), C.text, bo);
  node('积分服务', slow > .5 ? '响应变慢，迟迟不返回' : '非核心功能', 1660, 380, 320, 140, eo(p(t, 1.3, 1.8)), C.text, slow);
  [[370, 550], [850, 1030], [1330, 1500]].forEach(([x1, x2], i) => arrow(x1, 380, x2, 380, eo(p(t, 1 + i*.2, 1.5 + i*.2)), a*.8, 'rgba(255,255,255,.6)', 3));
  for (let k = 0; k < 14; k++){ const ts = 1.4 + k*.3, f = p(t, ts, ts + 1.2); if (f <= 0) continue;
    const stuck = ts > 1.9, x = stuck ? lerp(370, 1500, Math.min(f*1.1, 1)) - (stuck && f >= .91 ? (k % 4)*16 : 0) : lerp(370, 1500, f);
    if (!stuck && f >= 1) continue; if ((x > 540 && x < 860) || (x > 1020 && x < 1340)) continue; dot(x, 380 + ((k % 3) - 1)*14, 7, 1, stuck && f > .9 ? C.rose : C.mint); }
  const pa = eo(p(t, 2.3, 2.7));
  txt('订单服务的线程池', 1180, 500, {size:22, weight:800, color:C.muted, alpha:pa});
  slots(1180 - 236, 530, 20, 10, Math.round(full*20), pa, 40, 30, 8);
  txt(full >= 1 ? '全部卡在等积分服务' : '', 1180, 640, {size:24, weight:900, color:C.rose, alpha:eo(p(t, 4.1, 4.4))});
  rise('非核心的积分服务，拖垮了下单这条核心链路', W/2, 780, t, 5.4, {size:36, weight:900, color:C.gold});
  rise('熔断、降级、隔离，就是来防这件事的', W/2, 870, t, 6, {size:32, weight:800, color:C.acc});
}

/* ============ 场景 2 · 雪崩效应 (7–19s) ============ */
function s2(t){
  rise('雪崩效应：故障是怎么一层层传上去的', W/2, 90, t, 7.2, {size:52, weight:900});
  const S = [['服务 A', '网关', 12.6, 14.4], ['服务 B', '订单服务', 10.6, 12.6], ['服务 C', '库存服务', 8.8, 10.6]];
  S.forEach(([h, d, f0, f1], i) => { const x = 360 + i*600, e = eo(p(t, 7.6 + i*.3, 8.1 + i*.3)), f = p(t, f0, f1), bad = f >= 1 ? 1 : 0;
    box(x - 230, 170, 460, 330, e, {fill: bad ? 'rgba(255,138,138,.10)' : 'rgba(255,255,255,.04)', stroke: bad ? C.rose : 'rgba(255,255,255,.3)', r:22, glow: bad*16});
    txt(h, x, 215, {size:34, weight:900, color: bad ? C.rose : C.text, alpha:e}); txt(d, x, 260, {size:22, weight:700, color:C.muted, alpha:e});
    txt('线程池', x, 305, {size:20, weight:700, color:C.muted, alpha:e});
    slots(x - 188, 335, 16, 8, Math.round(f*16), e, 40, 32, 8);
    txt(i === 2 ? (t > 8.8 ? '数据库慢查询，响应变慢' : '') : (f >= 1 ? '线程全在等下游' : (f > 0 ? '线程逐渐被占满…' : '')), x, 460, {size:22, weight:800, color: i === 2 ? C.gold : C.rose, alpha:e});
    if (i < 2) arrow(x + 240, 335, x + 350, 335, e, e*.8, 'rgba(255,255,255,.6)', 3); });
  [['① 下游变慢', ['库存服务查询变慢，', '每个请求都要等很久'], 9.2], ['② 上游线程被占满', ['订单服务的线程都在', '同步等待库存服务'], 11], ['③ 上游也「变慢」', ['新请求排队、超时，', '订单服务对外表现为故障'], 12.8], ['④ 层层传导', ['网关、其他依赖订单的服务', '也陆续被拖垮，整站不可用'], 14.5]].forEach(([h, ls, ts], i) =>
    card(h, ls, 120 + i*426, 560, 400, 210, eo(p(t, ts, ts + .5)), i === 3 ? C.rose : C.acc, {hs:28}));
  rise('「慢」比「挂」更可怕：挂了会立刻报错，慢了会一直占着线程', W/2, 850, t, 15.6, {size:32, weight:900, color:C.gold});
  rise('对策：别无限等（超时） · 及时止损（熔断） · 准备备选（降级） · 互不牵连（隔离）', W/2, 940, t, 16.6, {size:28, weight:700});
}

/* ============ 场景 3 · 超时与重试 (19–30s) ============ */
const JIT = (() => { const r = rnd(257); return Array.from({length:6}, () => [r(), r(), r(), r()]); })();
function s3(t){
  rise('第一道防线：超时。重试要小心', W/2, 80, t, 19.2, {size:52, weight:900});
  const a = eo(p(t, 19.6, 20.1));
  box(120, 150, 800, 380, a, {fill:'rgba(255,255,255,.03)', stroke:'rgba(255,255,255,.18)', r:22});
  txt('超时：到点就放弃', 520, 195, {size:32, weight:900, color:C.acc, alpha:a});
  txt('不设超时', 160, 280, {size:24, weight:800, color:C.rose, align:'left', alpha:a});
  const k1 = p(t, 20.2, 24);
  box(300, 266, lerp(0, 580, k1), 28, a, {fill:'rgba(255,138,138,.35)', stroke:C.rose, r:8});
  txt('线程一直被占着……', 590, 330, {size:22, weight:700, color:C.rose, alpha:eo(p(t, 21, 21.4))});
  txt('超时 1 秒', 160, 410, {size:24, weight:800, color:C.mint, align:'left', alpha:a});
  const k2 = p(t, 20.2, 21.2);
  box(300, 396, lerp(0, 160, k2), 28, a, {fill:'rgba(110,231,200,.35)', stroke:C.mint, r:8});
  txt('✂ 放弃，释放线程，返回错误或降级结果', 480, 410, {size:22, weight:700, color:C.mint, align:'left', alpha:eo(p(t, 21.3, 21.7))});
  txt('超时值参考下游正常耗时（如 P99）再留些余量', 520, 485, {size:21, weight:600, color:C.muted, alpha:eo(p(t, 22, 22.4))});

  const b = eo(p(t, 22.4, 22.9));
  box(1000, 150, 800, 380, b, {fill:'rgba(255,255,255,.03)', stroke:'rgba(255,255,255,.18)', r:22});
  txt('重试会放大流量', 1400, 195, {size:32, weight:900, color:C.acc, alpha:b});
  [['A', '1'], ['B', '×3'], ['C', '×9'], ['D', '×27']].forEach(([n, v], i) => { const e = eo(p(t, 22.8 + i*.45, 23.2 + i*.45)), x = 1100 + i*200;
    box(x - 55, 250, 110, 80, e, {fill: i === 3 ? 'rgba(255,138,138,.18)' : 'rgba(255,255,255,.06)', stroke: i === 3 ? C.rose : 'rgba(255,255,255,.35)', r:14});
    txt(n, x, 290, {size:32, weight:900, alpha:e, color: i === 3 ? C.rose : C.text});
    txt(v, x, 370, {size:30, weight:900, font:MONO, color: i === 3 ? C.rose : C.gold, alpha:e});
    if (i) arrow(x - 140, 290, x - 62, 290, e, e*.8, 'rgba(255,255,255,.6)', 3); });
  txt('每层最多尝试 3 次 → 最底层收到 27 倍请求', 1400, 440, {size:24, weight:800, color:C.gold, alpha:eo(p(t, 24.8, 25.2))});
  txt('下游本来就快撑不住，重试是在火上浇油', 1400, 485, {size:21, weight:600, color:C.muted, alpha:eo(p(t, 25.2, 25.6))});

  const c = eo(p(t, 25.6, 26.1));
  box(120, 570, 1680, 380, c, {fill:'rgba(255,255,255,.03)', stroke:'rgba(255,255,255,.18)', r:22});
  txt('固定间隔重试', 150, 660, {size:24, weight:800, color:C.rose, align:'left', alpha:c});
  txt('大家同一时刻一起重试', 150, 700, {size:20, weight:600, color:C.muted, align:'left', alpha:c});
  txt('指数退避 + 随机抖动', 150, 830, {size:24, weight:800, color:C.mint, align:'left', alpha:c});
  txt('间隔 100→200→400ms… 再随机打散', 150, 870, {size:20, weight:600, color:C.muted, align:'left', alpha:c});
  const X0 = 560, U = 38, sweep = lerp(X0, 1760, p(t, 26, 28.6));
  [0, 1].forEach(row => { ctx.save(); al(c*.5); ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X0, row ? 920 : 760); ctx.lineTo(1760, row ? 920 : 760); ctx.stroke(); ctx.restore(); });
  JIT.forEach((js, j) => {
    for (let n = 0; n < 4; n++){ const x = X0 + (n + 1)*270; if (x <= sweep) dot(x, 610 + j*24, 6, c, C.rose); }
    let acc = 0; for (let n = 0; n < 4; n++){ acc += js[n]*U*Math.pow(2, n + 1) + 40; const x = X0 + acc; if (x <= sweep) dot(x, 790 + j*22, 6, c, C.mint); } });
  rise('另外：只重试幂等操作；限制次数；最好只在一层重试', W/2, 1005, t, 27.6, {size:28, weight:900, color:C.gold});
}

/* ============ 场景 4 · 熔断器三态 (30–44s) ============ */
function s4(t){
  rise('熔断器：三种状态', W/2, 80, t, 30.2, {size:54, weight:900});
  const CL = [400, 400], OP = [1520, 400], HO = [960, 720], R = 120;
  // 状态时间线

/* ============ 场景 5 · 滑动窗口 (44–55s) ============ */

  for (let i = 0; i < k + 1 && i < CALLS.length; i++){ const x = X1 - (kf - i)*100 + 4;

  BK.forEach(([s, fl], i) => { const e = eo(p(t, 50 + i*.15, 50.4 + i*.15)), x = 170 + i*78, base = 860, u = 22;
    box(x, base - s*u, 56, s*u, e, {fill:'rgba(110,231,200,.35)', stroke:C.mint, r:6});

/* ============ 总调度 ============ */
const SCENES = [[s1,-1,7],[s2,7,19],[s3,19,30],[s4,30,44],[s5,44,55],[s6,55,65],[s7,65,78],[s8,78,84]];
function draw(t){
  t = clamp(t, 0, DUR);
  ctx.save(); ctx.globalAlpha = 1; ctx.clearRect(0,0,W,H); background(t);
  for (const [fn,a,b] of SCENES){
    if (t < a || t > b) continue;
    SA = sceneA(t, a, b, b === DUR ? .8 : .5);
    if (SA > 0){ ctx.save(); fn(t); ctx.restore(); }
  }
  SA = 1; vignette();
  const fo = p(t, DUR - .8, DUR);
  if (fo > 0){ ctx.globalAlpha = fo; ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}

/* ============ 播放器 / 逐帧渲染接口 ============ */
const isRender = new URLSearchParams(location.search).has('render');
window.DURATION = DUR;
window.renderFrame = t => draw(t);
const btn = document.getElementById('btn'), seek = document.getElementById('seek'), timeEl = document.getElementById('time');
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function fit(){
  if (isRender){ cv.style.width = W+'px'; cv.style.height = H+'px'; return; }
  const w = Math.min(innerWidth - 32, (innerHeight - 84)*16/9);
  cv.style.width = w + 'px'; cv.style.height = w*9/16 + 'px';
}
addEventListener('resize', fit); fit();

let cur = 0, playing = !isRender, last = null;
function toggle(){ if (cur >= DUR) cur = 0; playing = !playing; }
btn.onclick = toggle; cv.onclick = toggle;
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); toggle(); } });
seek.oninput = () => { cur = +seek.value; draw(cur); };
function loop(ts){
  if (playing && last != null){ cur += (ts - last)/1000; if (cur >= DUR){ cur = DUR; playing = false; } }
  last = ts; draw(cur);
  seek.value = cur; timeEl.textContent = `${fmt(cur)} / ${fmt(DUR)}`;
  btn.textContent = playing ? '❚❚' : (cur >= DUR ? '↺' : '▶');
  requestAnimationFrame(loop);
}
document.fonts.ready.then(() => {
  window.ready = true;
  if (isRender) draw(0); else requestAnimationFrame(loop);
});
</script>
