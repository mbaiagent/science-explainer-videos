<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>负载均衡与一致性哈希 · 拾星</title>
<style>
  :root{--bg:#07080f;--fg:#f4ede4;--muted:#9a93a8;--acc:#6ee7b7}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
  #stage{display:block;background:#07080f;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);cursor:pointer}
  #bar{display:flex;align-items:center;gap:12px;width:min(calc(100vw - 32px),640px)}
  #btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(110,231,183,.5);background:transparent;
    color:var(--acc);font-size:16px;cursor:pointer;flex:none}
  #seek{flex:1;accent-color:var(--acc)}
  #time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:84px;text-align:right}
  body.render{display:block}
  body.render #bar{display:none}
  body.render #stage{border-radius:0;box-shadow:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bar">
  <button id="btn" aria-label="播放/暂停">❚❚</button>
  <input id="seek" type="range" min="0" max="84" step="0.01" value="0">
  <span id="time">0:00 / 1:24</span>
</div>
<script>
/* ============ 基础设置（横屏 1920×1080） ============ */
const W = 1920, H = 1080, DUR = 84;
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const FONT = '"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif';
const MONO = '"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono CJK SC","PingFang SC","Microsoft YaHei",monospace';
const C = {acc:'#6ee7b7', mint:'#6ee7c8', gold:'#ffd38a', coral:'#ff9e7a', rose:'#ff8a8a', blue:'#9cc3ff', text:'#f4ede4', muted:'#9a93a8', dim:'#4a4558', panel:'#0f0e1f'};

const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const p = (t,a,b) => clamp((t-a)/(b-a));
const eo = x => 1 - Math.pow(1-x, 3);
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const eback = x => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
function rnd(seed){ let s = seed>>>0; return () => { s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }

let SA = 1;
const al = a => { ctx.globalAlpha = clamp(SA*a); };
const sceneA = (t,a,b,f=.5) => Math.min(p(t,a,a+f), 1 - p(t,b-f,b));

function txt(s, x, y, o = {}){
  const {size=64, weight=700, color=C.text, alpha=1, align='center', glow=0, scale=1, font=FONT} = o;
  if (alpha <= 0) return;
  ctx.save(); al(alpha);
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (glow){ ctx.shadowColor = color; ctx.shadowBlur = glow; }
  if (scale !== 1){ ctx.translate(x, y); ctx.scale(scale, scale); ctx.fillText(s, 0, 0); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}
function rise(s, x, y, t, t0, o = {}, d = .7){
  const e = eo(p(t, t0, t0+d));
  if (e <= 0) return;
  txt(s, x, y + (1-e)*36, {...o, alpha:(o.alpha ?? 1)*e});
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function box(x, y, w, h, a, o = {}){
  const {fill='rgba(255,255,255,.05)', stroke='rgba(110,231,183,.35)', lw=2, glow=0, r=18, dash=null} = o;
  if (a <= 0) return;
  ctx.save(); al(a); rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (dash) ctx.setLineDash(dash);
  ctx.strokeStyle = stroke; ctx.lineWidth = lw; if (glow){ ctx.shadowColor = stroke; ctx.shadowBlur = glow; } ctx.stroke(); ctx.restore();
}
function arrow(x1, y1, x2, y2, e, a, color = C.acc, lw = 3){
  if (e <= 0 || a <= 0) return;
  const x = lerp(x1, x2, e), y = lerp(y1, y2, e), ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); al(a); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  if (e > .85){ ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-14, -9); ctx.lineTo(-14, 9); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function panel(x, y, w, h, title, a){
  box(x, y, w, h, a, {fill:C.panel, stroke:'rgba(255,255,255,.1)', r:20});
  if (a <= 0) return;
  ctx.save(); al(a); ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + 52); ctx.lineTo(x + w, y + 52); ctx.stroke();
  ['#ff6b6b','#ffd166','#6ee7a0'].forEach((c, i) => { ctx.fillStyle = c; ctx.globalAlpha = clamp(SA*a*.8); ctx.beginPath(); ctx.arc(x + 30 + i*24, y + 26, 7, 0, 6.283); ctx.fill(); });
  ctx.restore();
  txt(title, x + w/2, y + 27, {size:22, weight:500, color:C.muted, font:MONO, alpha:a});
}

/* ============ 背景 ============ */
const PARTS = (() => { const r = rnd(269); return Array.from({length:100}, () => ({
  x:r()*W, y:r()*H, s:r()*2.2+.5, v:r()*12+4, ph:r()*6.283, c:r()<.25})); })();
function background(t){
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0a0916'); g.addColorStop(.55,'#110f24'); g.addColorStop(1,'#18122c');
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const gx = W*.5 + Math.sin(t*.27)*140;
  const rg = ctx.createRadialGradient(gx, H*.45, 0, gx, H*.45, 950);
  rg.addColorStop(0,'rgba(110,231,183,0.09)'); rg.addColorStop(1,'rgba(110,231,183,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = C.acc;
  for (let x = 40; x < W; x += 80) for (let y = 40; y < H; y += 80){ ctx.globalAlpha = .06; ctx.fillRect(x, y, 2, 2); }
  for (const q of PARTS){
    const y = ((q.y - t*q.v) % H + H) % H, x = q.x + Math.sin(t*.35 + q.ph)*12;
    ctx.globalAlpha = .2 + .3*(.5 + .5*Math.sin(t*1.2 + q.ph));
    ctx.fillStyle = q.c ? C.acc : '#d8d0ff';
    ctx.beginPath(); ctx.arc(x, y, q.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function vignette(){
  const v = ctx.createRadialGradient(W/2, H/2, W*.28, W/2, H/2, W*.62);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.globalAlpha = 1; ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}
function codeLine(s, x, y, size, a, kw = /\b(public|class|static|void|new|return)\b/){
  const parts = s.split(/("[^"]*"|\b(?:public|class|static|void|new|return|getstatic|ldc|invokevirtual)\b)/g);
  ctx.save(); al(a); ctx.font = `500 ${size}px ${MONO}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  let xx = x;
  for (const seg of parts){ if (!seg) continue;
    ctx.fillStyle = seg.startsWith('"') ? C.mint : /^(public|class|static|void|new|return|getstatic|ldc|invokevirtual)$/.test(seg) ? C.acc : C.text;
    ctx.fillText(seg, xx, y); xx += ctx.measureText(seg).width; }
  ctx.restore();
}

const NC = {A:C.gold, B:C.blue, C:C.rose, D:C.acc, E:'#c4b5fd'};
function card(h, lines, x, y, w, hh, a, c = C.acc, o = {}){
  const {hs=30, ls=22, lh=40} = o;
  box(x, y, w, hh, a, {fill:'rgba(110,231,183,.05)', stroke:c === C.acc ? 'rgba(110,231,183,.5)' : c, r:20});
  txt(h, x + 30, y + 44, {size:hs, weight:900, color:c, align:'left', alpha:a});
  lines.forEach((s, i) => txt(s, x + 30, y + 96 + i*lh, {size:ls, weight:600, color:'#d9d2e4', align:'left', alpha:a}));
}
function nodeBox(label, sub, cx, cy, w, h, a, c = C.text, hl = 0){
  box(cx - w/2, cy - h/2, w, h, a, {fill:hl ? 'rgba(110,231,183,.16)' : 'rgba(255,255,255,.05)', stroke:hl ? C.acc : 'rgba(255,255,255,.3)', r:16, glow:hl ? 18 : 0});
  txt(label, cx, cy - (sub ? 14 : 0), {size:28, weight:900, color:c, alpha:a});
  if (sub) txt(sub, cx, cy + 24, {size:19, weight:600, color:C.muted, alpha:a});
}
function chip(s, cx, cy, w, a, c){
  box(cx - w/2, cy - 28, w, 56, a, {fill:'rgba(255,255,255,.06)', stroke:c, r:10});
  txt(s, cx, cy, {size:28, weight:900, font:MONO, color:c, alpha:a});
}
function hbar(label, val, x, y, scale, a, c){
  txt(label, x, y, {size:24, weight:900, color:c, align:'left', alpha:a});
  box(x + 50, y - 18, 520, 36, a, {fill:'rgba(255,255,255,.04)', stroke:'rgba(255,255,255,.15)', r:8});
  if (a > 0){ ctx.save(); al(a); ctx.fillStyle = c; rr(x + 52, y - 16, Math.max(4, 516*val/scale), 32, 7); ctx.fill(); ctx.restore(); }
  txt(val.toFixed(1) + '%', x + 590, y, {size:22, weight:800, font:MONO, color:C.text, align:'left', alpha:a});
}
const RX = 560, RY = 580, RR = 300;
const ringPt = (deg, r = RR) => [RX + r*Math.sin(deg*Math.PI/180), RY - r*Math.cos(deg*Math.PI/180)];

/* ============ 场景 1 · 钩子 (0–7s) ============ */
function s1(t){
  rise('缓存集群加 1 台机器，八成缓存瞬间失效', W/2, 110, t, .2, {size:52, weight:900});
  ['A', 'B', 'C', 'D', 'E'].forEach((n, i) => { const e = i < 4 ? eo(p(t, .7 + i*.15, 1.1 + i*.15)) : eback(p(t, 1.9, 2.4)), x = W/2 + (i - 2)*320;
    if (e <= 0) return;
    nodeBox('缓存 ' + n, i === 4 ? '新加的' : '', x, 290, 230, 110, clamp(e), NC[n], i === 4); });
  const f = p(t, 2.3, 2.7);
  txt('node = hash(key) % 4', W/2, 450, {size:40, weight:800, font:MONO, alpha:eo(p(t, 1.2, 1.6))*(1 - f)});
  txt('node = hash(key) % 5', W/2, 450, {size:40, weight:800, font:MONO, color:C.gold, alpha:f});
  rise('79.7% 的 key 换了节点', W/2, 570, t, 3, {size:64, weight:900, color:C.rose, glow:18});
  rise('（10 万个 key 实测）', W/2, 645, t, 3.4, {size:24, weight:700, color:C.muted});
  ['缓存大面积未命中', '请求涌向数据库', '数据库被打挂'].forEach((s, i) => { const e = eo(p(t, 4 + i*.4, 4.4 + i*.4)), x = W/2 + (i - 1)*460;
    box(x - 180, 730, 360, 80, e, {fill:'rgba(255,138,138,.10)', stroke:C.rose, r:16});
    txt(s, x, 770, {size:28, weight:800, alpha:e});
    if (i) arrow(x - 270, 770, x - 190, 770, e, e, C.rose, 3); });
  rise('问题出在「怎么分」：负载均衡与一致性哈希', W/2, 920, t, 5.5, {size:38, weight:900, color:C.acc});
}

/* ============ 场景 2 · 为什么需要负载均衡 (7–18s) ============ */
function s2(t){
  rise('为什么需要负载均衡', W/2, 90, t, 7.2, {size:56, weight:900});
  rise('一台机器扛不住 → 加机器；加了机器 → 谁来分活？', W/2, 160, t, 7.6, {size:28, weight:700, color:C.muted});
  const a = eo(p(t, 8, 8.4));
  nodeBox('用户', '海量请求', 200, 450, 220, 110, a);
  const d = eo(p(t, 8.4, 8.8));
  nodeBox('DNS', '', 560, 260, 200, 90, d, C.gold);
  arrow(312, 410, 455, 290, d, d, C.gold, 3);
  const l = eo(p(t, 8.9, 9.3));
  nodeBox('LVS', 'VIP', 880, 450, 200, 110, l, C.blue);
  arrow(312, 450, 775, 450, l, l, C.blue, 3);
  const n = eo(p(t, 9.4, 9.8));
  [340, 560].forEach(y => { nodeBox('Nginx', '', 1230, y, 200, 90, n, C.acc); arrow(982, 450, 1125, y, n, n, C.blue, 3); });
  const s = eo(p(t, 9.9, 10.3));
  [250, 450, 650].forEach(y => { nodeBox('应用', '', 1600, y, 200, 90, s);
    [340, 560].forEach(ny => arrow(1332, ny, 1495, y, s, s*.6, C.acc, 2)); });
  [['DNS 负载均衡', ['一个域名返回多个 IP', '按地域、运营商就近'], C.gold, 560, 10.8],
   ['四层：LVS', ['只看 IP + 端口', '转发连接，性能极高'], C.blue, 900, 11.6],
   ['七层：Nginx', ['看 URL、Header、Cookie', '可按路径路由、改写'], C.acc, 1240, 12.4],
   ['应用服务器', ['无状态，随时增减', '坏一台就摘掉'], C.text, 1600, 13.2]].forEach(([h, ls, c, x, ts]) => { const e = eo(p(t, ts, ts + .5));
    txt(h, x, 790, {size:28, weight:900, color:c, alpha:e});
    ls.forEach((q, i) => txt(q, x, 840 + i*40, {size:22, weight:600, color:'#d9d2e4', alpha:e})); });
  rise('目标：分摊压力、水平扩展、坏一台不影响整体', W/2, 1000, t, 14.4, {size:30, weight:900, color:C.gold});
}

/* ============ 场景 3 · 四层 vs 七层 + 客户端负载均衡 (18–30s) ============ */
function s3(t){
  rise('四层 vs 七层，以及客户端负载均衡', W/2, 90, t, 18.2, {size:54, weight:900});
  const R = [['', '四层（LVS 等）', '七层（Nginx 等）'], ['依据', 'IP + 端口', 'HTTP 内容：URL、Header…'], ['连接', '转发数据包，不拆开看', '终止连接，解析后再转发'],
             ['性能', '极高', '较高，要解析协议'], ['能力', '简单分发', '路由、重试、TLS 卸载']];
  R.forEach(([k, v1, v2], i) => { const e = eo(p(t, 18.6 + i*.45, 19 + i*.45)), y = 200 + i*76, hd = i === 0;
    if (i % 2 === 1) box(120, y - 34, 980, 68, e, {fill:'rgba(255,255,255,.035)', stroke:'rgba(255,255,255,0)', r:10});
    txt(k, 150, y, {size:24, weight:900, color:C.muted, align:'left', alpha:e});
    txt(v1, 300, y, {size:hd ? 28 : 24, weight:hd ? 900 : 700, color:hd ? C.blue : C.text, align:'left', alpha:e});
    txt(v2, 680, y, {size:hd ? 28 : 24, weight:hd ? 900 : 700, color:hd ? C.acc : C.text, align:'left', alpha:e}); });
  const a = eo(p(t, 21.4, 21.9));
  txt('客户端负载均衡', 1480, 180, {size:32, weight:900, color:C.gold, alpha:a});
  nodeBox('注册中心', '', 1480, 270, 260, 80, a, C.gold);
  const b = eo(p(t, 22, 22.4));
  nodeBox('调用方', '本地地址列表 + 算法', 1480, 450, 360, 110, b, C.text);
  arrow(1480, 312, 1480, 393, b, b, C.gold, 3);
  txt('推送地址', 1580, 352, {size:20, weight:700, color:C.gold, align:'left', alpha:b});
  const c = eo(p(t, 22.6, 23)), pick = t > 23.4;
  [1260, 1480, 1700].forEach((x, i) => nodeBox('实例 ' + (i + 1), '', x, 640, 180, 80, c, C.text, pick && i === 2));
  arrow(1560, 507, 1680, 598, eo(p(t, 23.4, 23.8)), c, C.acc, 3);
  txt('自己挑一台，直连', 1300, 548, {size:20, weight:700, color:C.acc, alpha:eo(p(t, 23.6, 24))});
  rise('Dubbo、gRPC、Spring Cloud LoadBalancer 都支持这种方式', 1480, 730, t, 24.2, {size:22, weight:700, color:C.muted});
  card('集中式（LVS / Nginx）', ['调用方无感知，对外统一入口', '多一跳，代理本身要做高可用'], 120, 790, 820, 200, eo(p(t, 25.2, 25.7)), C.blue, {lh:42});
  card('客户端式（服务发现 + 本地选择）', ['少一跳，没有单点', '每种语言的客户端都要实现一遍'], 980, 790, 820, 200, eo(p(t, 26, 26.5)), C.gold, {lh:42});
}

/* ============ 场景 4 · 算法 + 平滑加权轮询 (30–43s) ============ */
function s4(t){
  rise('负载均衡算法：这个请求给谁？', W/2, 90, t, 30.2, {size:54, weight:900});
  [['轮询', ['依次轮流', '忽略机器差异']], ['加权轮询', ['按权重轮流', '配置高的多分']], ['随机', ['随机挑一台', '量大时趋于均匀']],
   ['最少连接', ['选当前连接最少的', '耗时差异大时好用']], ['源地址哈希', ['hash(客户端 IP)', '同一客户端同一台']]].forEach(([h, ls], i) =>
    card(h, ls, 120 + i*340, 160, 320, 200, eo(p(t, 30.6 + i*.35, 31 + i*.35)), i === 1 ? C.gold : C.acc, {lh:40}));
  rise('平滑加权轮询（Nginx 的做法）：权重 A=5, B=1, C=1', 120, 430, t, 32.6, {size:30, weight:900, color:C.gold, align:'left'});
  const ha = eo(p(t, 33.2, 33.6));
  [['第 n 次', 180], ['current 加权后', 420], ['选中', 640], ['减去总权重 7', 880]].forEach(([s, x]) => txt(s, x, 500, {size:22, weight:800, color:C.muted, alpha:ha}));
  const T = [['[5, 1, 1]', 'A', '[-2, 1, 1]'], ['[3, 2, 2]', 'A', '[-4, 2, 2]'], ['[1, 3, 3]', 'B', '[1, -4, 3]'], ['[6, -3, 4]', 'A', '[-1, -3, 4]'],
             ['[4, -2, 5]', 'C', '[4, -2, -2]'], ['[9, -1, -1]', 'A', '[2, -1, -1]'], ['[7, 0, 0]', 'A', '[0, 0, 0]']];
  T.forEach(([b, s, af], i) => { const e = eo(p(t, 33.6 + i*.55, 34 + i*.55)), y = 555 + i*62;
    if (i % 2 === 0) box(120, y - 28, 1000, 56, e, {fill:'rgba(255,255,255,.035)', stroke:'rgba(255,255,255,0)', r:8});
    txt(String(i + 1), 180, y, {size:24, weight:800, font:MONO, alpha:e});
    txt(b, 420, y, {size:24, weight:700, font:MONO, alpha:e});
    txt(s, 640, y, {size:28, weight:900, font:MONO, color:NC[s], alpha:e});
    txt(af, 880, y, {size:24, weight:700, font:MONO, color:C.muted, alpha:e}); });
  const r = eo(p(t, 33.4, 33.9));
  txt('每一轮三步：', 1200, 520, {size:28, weight:900, color:C.acc, align:'left', alpha:r});
  ['① 每个节点 current += 自己的权重', '② 选 current 最大的节点', '③ 被选中的节点 current -= 总权重'].forEach((s, i) =>
    txt(s, 1200, 580 + i*50, {size:24, weight:700, align:'left', alpha:eo(p(t, 33.8 + i*.3, 34.2 + i*.3))}));
  const n1 = eo(p(t, 38.2, 38.6)), n2 = eo(p(t, 39.2, 39.6));
  txt('朴素加权轮询：A 连着挨 5 下', 1200, 770, {size:24, weight:800, color:C.rose, align:'left', alpha:n1});
  'AAAAABC'.split('').forEach((s, i) => chip(s, 1240 + i*78, 830, 66, n1, NC[s]));
  txt('平滑加权轮询：比例不变，分布均匀', 1200, 910, {size:24, weight:800, color:C.acc, align:'left', alpha:n2});
  'AABACAA'.split('').forEach((s, i) => chip(s, 1240 + i*78, 970, 66, n2, NC[s]));
}

/* ============ 场景 5 · 取模哈希的问题 (43–54s) ============ */
function s5(t){
  rise('普通哈希：node = hash(key) % N', W/2, 90, t, 43.2, {size:54, weight:900});
  rise('节点数一变，几乎所有 key 都要换地方', W/2, 160, t, 43.6, {size:28, weight:700, color:C.muted});
  const L = 'ABCDE', x0 = 180, dx = 82, hl = p(t, 47.4, 47.8);
  txt('hash(key) =', 120, 250, {size:24, weight:800, color:C.muted, align:'left', alpha:eo(p(t, 44, 44.4))});
  txt('4 台：hash % 4', 120, 360, {size:24, weight:800, color:C.text, align:'left', alpha:eo(p(t, 44.8, 45.2))});
  txt('5 台：hash % 5', 120, 500, {size:24, weight:800, color:C.gold, align:'left', alpha:eo(p(t, 46, 46.4))});
  for (let h = 0; h < 20; h++){ const x = x0 + h*dx + 30, same = h % 4 === h % 5;
    const e0 = eo(p(t, 44 + h*.04, 44.4 + h*.04)), e1 = eo(p(t, 44.8 + h*.04, 45.2 + h*.04)), e2 = eo(p(t, 46 + h*.04, 46.4 + h*.04));
    txt(String(h), x, 300, {size:24, weight:800, font:MONO, color:C.muted, alpha:e0});
    const n4 = L[h % 4], n5 = L[h % 5], dim = 1 - (same ? 0 : hl*.55);
    box(x - 34, 380, 68, 64, e1, {fill:'rgba(255,255,255,.05)', stroke:NC[n4], r:10});
    txt(n4, x, 412, {size:28, weight:900, font:MONO, color:NC[n4], alpha:e1});
    box(x - 34, 520, 68, 64, e2*dim, {fill:same && hl > 0 ? 'rgba(110,231,183,.20)' : 'rgba(255,255,255,.05)', stroke:same && hl > 0 ? C.acc : NC[n5], r:10, glow:same ? hl*16 : 0, lw:same && hl > 0 ? 3 : 2});
    txt(n5, x, 552, {size:28, weight:900, font:MONO, color:NC[n5], alpha:e2*dim}); }
  rise('20 个里只有 0~3 这 4 个没动 → 约 80% 的 key 换了节点', W/2, 650, t, 47.8, {size:34, weight:900, color:C.rose});
  rise('实测 10 万个 key，从 4 台扩到 5 台：79.7% 迁移', W/2, 715, t, 48.6, {size:26, weight:700, color:C.muted});
  card('后果', ['缓存：大量 key 落到「新」节点，集中未命中，请求压向数据库', '有状态服务：会话、长连接几乎全部要重新分配'], 260, 780, 1400, 180, eo(p(t, 49.6, 50.1)), C.rose, {lh:42});
  rise('想要：增删节点时，只挪动一小部分 key → 一致性哈希', W/2, 1010, t, 51, {size:30, weight:900, color:C.acc});
}

/* ============ 场景 6 · 一致性哈希环 (54–67s) ============ */
function s6(t){
  rise('一致性哈希：把哈希值围成一个环', W/2, 90, t, 54.2, {size:54, weight:900});
  const a = eo(p(t, 54.6, 55.2));
  if (a > 0){ ctx.save(); al(a); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(RX, RY, RR, -Math.PI/2, -Math.PI/2 + 6.283*eo(p(t, 54.6, 55.6))); ctx.stroke(); ctx.restore(); }
  txt('0 / 2³²', RX, RY - RR - 40, {size:20, weight:700, font:MONO, color:C.muted, alpha:a});
  txt('顺时针 ↻', RX, RY, {size:26, weight:800, color:C.muted, alpha:a});
  const addE = p(t, 60.6, 61.1), mv = p(t, 61.6, 62.2);
  if (addE > 0){ ctx.save(); al(addE); ctx.strokeStyle = NC.E; ctx.lineWidth = 10; ctx.shadowColor = NC.E; ctx.shadowBlur = 16; ctx.beginPath();
    ctx.arc(RX, RY, RR, (200 - 90)*Math.PI/180, (200 - 90 + 50*eo(addE))*Math.PI/180); ctx.stroke(); ctx.restore(); }
  const ex = p(t, 57.8, 58.6);
  if (ex > 0 && addE < 1){ ctx.save(); al(1 - addE); ctx.strokeStyle = C.rose; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(RX, RY, RR, (140 - 90)*Math.PI/180, (140 - 90 + 60*eo(ex))*Math.PI/180); ctx.stroke(); ctx.restore(); }
  const K = [[15, 'A'], [50, 'B'], [75, 'B'], [100, 'B'], [140, 'C'], [165, 'C'], [185, 'C'], [215, 'D'], [235, 'D'], [265, 'D'], [310, 'A'], [335, 'A']];
  K.forEach(([deg, own], i) => { const e = eo(p(t, 55.8 + i*.08, 56.2 + i*.08)); if (e <= 0) return;
    const [x, y] = ringPt(deg), moved = deg > 200 && deg < 250, col = p(t, 57, 57.5);
    let c = col > 0 ? NC[own] : C.text; if (moved && mv > 0) c = NC.E;
    ctx.save(); al(e); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 11, 0, 6.283); ctx.fill();
    if (moved && mv > 0){ ctx.strokeStyle = NC.E; ctx.lineWidth = 3; ctx.globalAlpha = clamp(SA*mv); ctx.beginPath(); ctx.arc(x, y, 20, 0, 6.283); ctx.stroke(); }
    ctx.restore(); });
  [['A', 30], ['B', 120], ['C', 200], ['D', 290], ['E', 250]].forEach(([n, deg], i) => { const e = i < 4 ? eback(p(t, 55.2 + i*.15, 55.7 + i*.15)) : eback(addE);
    if (e <= 0) return; const [x, y] = ringPt(deg), [lx, ly] = ringPt(deg, RR + 62);
    ctx.save(); al(clamp(e)); ctx.fillStyle = NC[n]; ctx.shadowColor = NC[n]; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(x, y, 22*e, 0, 6.283); ctx.fill(); ctx.restore();
    txt(n, lx, ly, {size:34, weight:900, color:NC[n], alpha:clamp(e)}); });
  const X = 1060;
  rise('① 哈希值空间 0 ~ 2³²−1 首尾相连，围成一个环', X, 200, t, 54.8, {size:26, weight:800, align:'left'});
  rise('② 节点：按 hash(IP 或名字) 放到环上', X, 260, t, 55.4, {size:26, weight:800, align:'left'});
  rise('③ key：按 hash(key) 放到环上，', X, 320, t, 56, {size:26, weight:800, align:'left'});
  rise('    顺时针遇到的第一个节点就是它的归属', X, 365, t, 56, {size:26, weight:800, align:'left'});
  rise('例：红色弧线上的 key，顺时针走到 C', X, 425, t, 57.8, {size:22, weight:700, color:C.rose, align:'left'});
  rise('加入节点 E', X, 520, t, 60.6, {size:34, weight:900, color:NC.E, align:'left'});
  rise('只有 C 到 E 之间的 key 从 D 搬到 E', X, 580, t, 61.4, {size:26, weight:800, align:'left'});
  rise('其他 key 原地不动', X, 630, t, 62, {size:26, weight:800, color:C.acc, align:'left'});
  const b = eo(p(t, 62.8, 63.3));
  box(X - 20, 690, 760, 150, b, {fill:'rgba(110,231,183,.08)', stroke:C.acc, r:18});
  txt('平均只需迁移约 1/N 的 key', X + 360, 740, {size:30, weight:900, color:C.acc, alpha:b});
  txt('实测 4 → 5 台：约 20%（取模哈希是 79.7%）', X + 360, 795, {size:24, weight:700, alpha:b});
  rise('删除节点同理：只有它负责的 key 交给顺时针的下一个节点', X, 900, t, 64, {size:22, weight:700, color:C.muted, align:'left'});
}

/* ============ 场景 7 · 虚拟节点 + 应用 + 健康检查 (67–78s) ============ */
function s7(t){
  rise('虚拟节点、应用与健康检查', W/2, 90, t, 67.2, {size:54, weight:900});
  const a = eo(p(t, 67.6, 68));
  txt('每台只放 1 个点：区间有大有小，数据倾斜', 120, 180, {size:26, weight:900, color:C.rose, align:'left', alpha:a});
  [['A', 3.1], ['B', 1.3], ['C', 40.2], ['D', 55.4]].forEach(([n, v], i) => hbar(n, v, 120, 240 + i*56, 60, eo(p(t, 68 + i*.2, 68.4 + i*.2)), NC[n]));
  const b = eo(p(t, 69.6, 70));
  txt('每台 100 个虚拟节点：A#0 … A#99 撒满整个环', 120, 490, {size:26, weight:900, color:C.acc, align:'left', alpha:b});
  [['A', 25.7], ['B', 24.8], ['C', 25.2], ['D', 24.3]].forEach(([n, v], i) => hbar(n, v, 120, 550 + i*56, 60, eo(p(t, 70 + i*.2, 70.4 + i*.2)), NC[n]));
  rise('（10 万个 key 实测）扩容时，新节点从每台都分走一点', 120, 800, t, 71, {size:22, weight:700, color:C.muted, align:'left'});
  [['分布式缓存分片', ['客户端按 key 选缓存节点，增删节点只影响一小部分', '注意：Redis Cluster 用的是 16384 个哈希槽'], C.gold],
   ['有状态路由', ['同一用户 / 会话 / 长连接总落到同一台', 'Nginx：hash $key consistent；Dubbo 也有此策略'], C.blue],
   ['健康检查与故障摘除', ['主动探测 + 被动统计失败次数', '故障节点暂时摘除，恢复后再加回'], C.acc]].forEach(([h, ls, c], i) =>
    card(h, ls, 1000, 160 + i*235, 800, 210, eo(p(t, 71.6 + i*.6, 72.1 + i*.6)), c, {lh:42}));
  rise('负载均衡管「分得匀」，一致性哈希管「变得少」，健康检查管「不给坏的」', W/2, 930, t, 74, {size:30, weight:900, color:C.gold});
}

/* ============ 场景 8 · 收尾 (78–84s) ============ */
function s8(t){
  [['分层', 'DNS · 四层 · 七层 · 客户端'], ['算法', '轮询 · 加权 · 最少连接'], ['一致性哈希', '增删节点只动一段'], ['虚拟节点', '打散，避免倾斜']].forEach(([a, b], i) => {
    const st = 78.2 + i*.25, e = eback(p(t, st, st + .5)); if (e <= 0) return;
    const x = 330 + i*420, y = 330;
    ctx.save(); ctx.translate(x, y); ctx.scale(e, e); ctx.translate(-x, -y);
    box(x - 185, y - 90, 370, 180, clamp(e), {fill:'rgba(110,231,183,.08)', stroke:'rgba(110,231,183,.5)', r:26}); ctx.restore();
    txt(a, x, y - 22, {size:40, weight:900, color:C.acc, alpha:clamp(e)}); txt(b, x, y + 40, {size:22, weight:600, color:C.muted, alpha:clamp(e)});
  });
  rise('不只要分得匀，还要变得稳', W/2, 600, t, 79.2, {size:62, weight:900, glow:22});
  rise('关注拾星，一起搞懂后端', W/2, 760, t, 80, {size:36, weight:500, color:C.muted});
}
/* ============ 总调度 ============ */
const SCENES = [[s1,-1,7],[s2,7,18],[s3,18,30],[s4,30,43],[s5,43,54],[s6,54,67],[s7,67,78],[s8,78,84]];
function draw(t){
  t = clamp(t, 0, DUR);
  ctx.save(); ctx.globalAlpha = 1; ctx.clearRect(0,0,W,H); background(t);
  for (const [fn,a,b] of SCENES){
    if (t < a || t > b) continue;
    SA = sceneA(t, a, b, b === DUR ? .8 : .5);
    if (SA > 0){ ctx.save(); fn(t); ctx.restore(); }
  }
  SA = 1; vignette();
  const fo = p(t, DUR - .8, DUR);
  if (fo > 0){ ctx.globalAlpha = fo; ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}

/* ============ 播放器 / 逐帧渲染接口 ============ */
const isRender = new URLSearchParams(location.search).has('render');
window.DURATION = DUR;
window.renderFrame = t => draw(t);
const btn = document.getElementById('btn'), seek = document.getElementById('seek'), timeEl = document.getElementById('time');
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function fit(){
  if (isRender){ cv.style.width = W+'px'; cv.style.height = H+'px'; return; }
  const w = Math.min(innerWidth - 32, (innerHeight - 84)*16/9);
  cv.style.width = w + 'px'; cv.style.height = w*9/16 + 'px';
}
addEventListener('resize', fit); fit();

let cur = 0, playing = !isRender, last = null;
function toggle(){ if (cur >= DUR) cur = 0; playing = !playing; }
btn.onclick = toggle; cv.onclick = toggle;
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); toggle(); } });
seek.oninput = () => { cur = +seek.value; draw(cur); };
function loop(ts){
  if (playing && last != null){ cur += (ts - last)/1000; if (cur >= DUR){ cur = DUR; playing = false; } }
  last = ts; draw(cur);
  seek.value = cur; timeEl.textContent = `${fmt(cur)} / ${fmt(DUR)}`;
  btn.textContent = playing ? '❚❚' : (cur >= DUR ? '↺' : '▶');
  requestAnimationFrame(loop);
}
document.fonts.ready.then(() => {
  window.ready = true;
  if (isRender) draw(0); else requestAnimationFrame(loop);
});
</script>
