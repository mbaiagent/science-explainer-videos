<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库索引：B+ 树</title>
<style>
  :root{--bg:#07080f;--fg:#f4ede4;--muted:#9a93a8;--acc:#fb923c}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
  #stage{display:block;background:#07080f;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);cursor:pointer}
  #bar{display:flex;align-items:center;gap:12px;width:min(calc(100vw - 32px),640px)}
  #btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(251,146,60,.5);background:transparent;
    color:var(--acc);font-size:16px;cursor:pointer;flex:none}
  #seek{flex:1;accent-color:var(--acc)}
  #time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:84px;text-align:right}
  body.render{display:block}
  body.render #bar{display:none}
  body.render #stage{border-radius:0;box-shadow:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bar">
  <button id="btn" aria-label="播放/暂停">❚❚</button>
  <input id="seek" type="range" min="0" max="80" step="0.01" value="0">
  <span id="time">0:00 / 1:20</span>
</div>
<script>
/* ============ 基础设置（横屏 1920×1080） ============ */
const W = 1920, H = 1080, DUR = 80;
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const FONT = '"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif';
const MONO = '"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono CJK SC","PingFang SC","Microsoft YaHei",monospace';
const C = {acc:'#fb923c', mint:'#6ee7c8', gold:'#ffd38a', coral:'#ff9e7a', rose:'#ff8a8a', blue:'#9cc3ff', text:'#f4ede4', muted:'#9a93a8', dim:'#4a4558', panel:'#0f0e1f'};

const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const p = (t,a,b) => clamp((t-a)/(b-a));
const eo = x => 1 - Math.pow(1-x, 3);
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const eback = x => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
function rnd(seed){ let s = seed>>>0; return () => { s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }

let SA = 1;
const al = a => { ctx.globalAlpha = clamp(SA*a); };
const sceneA = (t,a,b,f=.5) => Math.min(p(t,a,a+f), 1 - p(t,b-f,b));

function txt(s, x, y, o = {}){
  const {size=64, weight=700, color=C.text, alpha=1, align='center', glow=0, scale=1, font=FONT} = o;
  if (alpha <= 0) return;
  ctx.save(); al(alpha);
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (glow){ ctx.shadowColor = color; ctx.shadowBlur = glow; }
  if (scale !== 1){ ctx.translate(x, y); ctx.scale(scale, scale); ctx.fillText(s, 0, 0); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}
function rise(s, x, y, t, t0, o = {}, d = .7){
  const e = eo(p(t, t0, t0+d));
  if (e <= 0) return;
  txt(s, x, y + (1-e)*36, {...o, alpha:(o.alpha ?? 1)*e});
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function box(x, y, w, h, a, o = {}){
  const {fill='rgba(255,255,255,.05)', stroke='rgba(251,146,60,.35)', lw=2, glow=0, r=18, dash=null} = o;
  if (a <= 0) return;
  ctx.save(); al(a); rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (dash) ctx.setLineDash(dash);
  ctx.strokeStyle = stroke; ctx.lineWidth = lw; if (glow){ ctx.shadowColor = stroke; ctx.shadowBlur = glow; } ctx.stroke(); ctx.restore();
}
function arrow(x1, y1, x2, y2, e, a, color = C.acc, lw = 3){
  if (e <= 0 || a <= 0) return;
  const x = lerp(x1, x2, e), y = lerp(y1, y2, e), ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); al(a); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  if (e > .85){ ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-14, -9); ctx.lineTo(-14, 9); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function panel(x, y, w, h, title, a){
  box(x, y, w, h, a, {fill:C.panel, stroke:'rgba(255,255,255,.1)', r:20});
  if (a <= 0) return;
  ctx.save(); al(a); ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + 52); ctx.lineTo(x + w, y + 52); ctx.stroke();
  ['#ff6b6b','#ffd166','#6ee7a0'].forEach((c, i) => { ctx.fillStyle = c; ctx.globalAlpha = clamp(SA*a*.8); ctx.beginPath(); ctx.arc(x + 30 + i*24, y + 26, 7, 0, 6.283); ctx.fill(); });
  ctx.restore();
  txt(title, x + w/2, y + 27, {size:22, weight:500, color:C.muted, font:MONO, alpha:a});
}

/* ============ 背景 ============ */
const PARTS = (() => { const r = rnd(131); return Array.from({length:100}, () => ({
  x:r()*W, y:r()*H, s:r()*2.2+.5, v:r()*12+4, ph:r()*6.283, c:r()<.25})); })();
function background(t){
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0a0916'); g.addColorStop(.55,'#110f24'); g.addColorStop(1,'#18122c');
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const gx = W*.5 + Math.sin(t*.27)*140;
  const rg = ctx.createRadialGradient(gx, H*.45, 0, gx, H*.45, 950);
  rg.addColorStop(0,'rgba(251,146,60,0.09)'); rg.addColorStop(1,'rgba(251,146,60,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = C.acc;
  for (let x = 40; x < W; x += 80) for (let y = 40; y < H; y += 80){ ctx.globalAlpha = .06; ctx.fillRect(x, y, 2, 2); }
  for (const q of PARTS){
    const y = ((q.y - t*q.v) % H + H) % H, x = q.x + Math.sin(t*.35 + q.ph)*12;
    ctx.globalAlpha = .2 + .3*(.5 + .5*Math.sin(t*1.2 + q.ph));
    ctx.fillStyle = q.c ? C.acc : '#d8d0ff';
    ctx.beginPath(); ctx.arc(x, y, q.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function vignette(){
  const v = ctx.createRadialGradient(W/2, H/2, W*.28, W/2, H/2, W*.62);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.globalAlpha = 1; ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}
function codeLine(s, x, y, size, a, kw = /\b(public|class|static|void|new|return)\b/){
  const parts = s.split(/("[^"]*"|\b(?:public|class|static|void|new|return|getstatic|ldc|invokevirtual)\b)/g);
  ctx.save(); al(a); ctx.font = `500 ${size}px ${MONO}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  let xx = x;
  for (const seg of parts){ if (!seg) continue;
    ctx.fillStyle = seg.startsWith('"') ? C.mint : /^(public|class|static|void|new|return|getstatic|ldc|invokevirtual)$/.test(seg) ? C.acc : C.text;
    ctx.fillText(seg, xx, y); xx += ctx.measureText(seg).width; }
  ctx.restore();
}

function pill(s, x, y, a, o = {}){
  const {size=30, color=C.text, stroke='rgba(255,255,255,.2)', fill='rgba(255,255,255,.05)', font=FONT, weight=700} = o;
  if (a <= 0) return;
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; const w = ctx.measureText(s).width + 52; ctx.restore();
  box(x - w/2, y - size*.9, w, size*1.8, a, {fill, stroke, r:size*.9});
  txt(s, x, y, {size, weight, color, font, alpha:a});
}
function keysNode(keys, cx, y, a, o = {}){
  const {cw=62, h=52, on=false, hit=-1, size=22, leaf=false, dim=false} = o;
  const w = cw*keys.length, x = cx - w/2;
  box(x, y - h/2, w, h, a*(dim ? .45 : 1), {fill:on ? 'rgba(251,146,60,.22)' : leaf ? 'rgba(110,231,200,.08)' : 'rgba(255,255,255,.05)', stroke:on ? C.acc : leaf ? 'rgba(110,231,200,.5)' : 'rgba(251,146,60,.45)', lw:on ? 3 : 2, glow:on ? 18 : 0, r:8});
  keys.forEach((k, i) => {
    if (i > 0){ ctx.save(); al(a*.4); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(x + i*cw, y - h/2 + 8, 1.5, h - 16); ctx.restore(); }
    txt(String(k), x + cw*(i + .5), y, {size, weight:800, font:MONO, color:i === hit ? C.gold : C.text, alpha:a*(dim ? .5 : 1)});
  });
  return {x, w};
}
const ROOT = [30, 60], MIDS = [[10, 20], [40, 50], [70, 80]];
const LEAVES = [[1,5,8],[10,13,17],[20,24,27],[30,33,37],[40,44,47],[50,55,58],[60,63,66],[70,74,77],[80,85,90]];
const LX = i => 160 + i*200, MX = i => 360 + i*600;
function drawTree(t, a, o = {}){
  const {path=[], leafOn=[], hits={}, ry=230, my=420, ly=640, linkA=1} = o;
  keysNode(ROOT, 960, ry, a, {on:path.includes('r')});
  MIDS.forEach((m, i) => {
    const on = path.includes('m' + i);
    ctx.save(); al(a*(on ? .9 : .35)); ctx.strokeStyle = on ? C.acc : 'rgba(255,255,255,.5)'; ctx.lineWidth = on ? 3 : 1.5;
    ctx.beginPath(); ctx.moveTo(960 - 62 + i*62, ry + 26); ctx.lineTo(MX(i), my - 26); ctx.stroke(); ctx.restore();
    keysNode(m, MX(i), my, a, {on});
  });
  LEAVES.forEach((l, i) => {
    const mi = Math.floor(i/3), on = path.includes('l' + i) || leafOn.includes(i);
    ctx.save(); al(a*(on ? .9 : .3)); ctx.strokeStyle = on ? C.acc : 'rgba(255,255,255,.5)'; ctx.lineWidth = on ? 3 : 1.5;
    ctx.beginPath(); ctx.moveTo(MX(mi) - 93 + (i % 3)*62, my + 26); ctx.lineTo(LX(i), ly - 26); ctx.stroke(); ctx.restore();
    keysNode(l, LX(i), ly, a, {cw:54, leaf:true, on, hit:hits[i] ?? -1, size:20});
    if (i < 8) arrow(LX(i) + 84, ly, LX(i) + 116, ly, 1, a*linkA, C.mint, 2);
  });
}

/* ============ 场景 1 · 钩子 (0–7s) ============ */
function s1(t){
  const a = eo(p(t, 0, .4));
  pill('SELECT * FROM user WHERE id = 8848;', W/2, 150, a, {size:32, font:MONO, color:C.acc, stroke:C.acc});
  box(560, 220, 800, 420, a, {fill:'#0f0e1c', stroke:'rgba(255,255,255,.15)', r:14});
  ['id', 'name', 'age'].forEach((c, i) => txt(c, 680 + i*260, 255, {size:24, weight:700, font:MONO, color:C.muted, alpha:a}));
  const scan = Math.floor(clamp((t - .8)/3)*8848);
  for (let r = 0; r < 7; r++){
    const id = Math.max(1, scan - 6 + r), y = 300 + r*48, cur = r === 6;
    if (cur){ ctx.save(); al(a*.8); ctx.fillStyle = 'rgba(255,138,138,.18)'; ctx.fillRect(570, y - 22, 780, 44); ctx.restore(); }
    txt(String(id), 680, y, {size:24, weight:600, font:MONO, color:cur ? C.rose : C.text, alpha:a*(.4 + r*.1)});
    txt('user_' + id, 940, y, {size:24, weight:600, font:MONO, alpha:a*(.4 + r*.1)}); txt(String(18 + id % 40), 1200, y, {size:24, weight:600, font:MONO, alpha:a*(.4 + r*.1)});
  }
  txt(`已扫描 ${scan.toLocaleString('en-US')} / 1,000,000 行`, W/2, 675, {size:26, weight:700, font:MONO, color:C.rose, alpha:a});
  rise('没有索引：只能一行一行地翻（全表扫描）', W/2, 770, t, 3.4, {size:46, weight:900});
  const k = p(t, 4.6, 5.2);
  if (k > 0) txt('索引 = 数据库的目录', W/2, 900, {size:84, weight:900, color:C.acc, glow:36, alpha:clamp(k*2), scale:eback(k)});
}

/* ============ 场景 2 · 为什么不用别的结构 (7–20s) ============ */
function s2(t){
  rise('为什么不用哈希表、二叉树？', W/2, 105, t, 7.2, {size:58, weight:900});
  rise('关键：数据在磁盘上，每读一个节点，就是一次磁盘 IO', W/2, 180, t, 8.0, {size:32, weight:700, color:C.gold});
  const pa = [eo(p(t, 9.0, 9.5)), eo(p(t, 10.6, 11.1)), eo(p(t, 12.4, 12.9))];
  [['哈希表', '等值查询很快', '但不支持范围查询和排序', C.rose], ['二叉搜索树', '每个节点只分两叉，树太高', '还可能退化成一条链', C.rose], ['B+ 树', '每个节点上千个分叉', '矮胖：3～4 层存千万行', C.mint]].forEach(([h, d1, d2, c], i) => {
    const x = 120 + i*580; box(x, 240, 540, 600, pa[i], {fill:'rgba(255,255,255,.03)', stroke:i === 2 ? C.mint : 'rgba(255,255,255,.18)', lw:i === 2 ? 3 : 2, glow:i === 2 ? 14 : 0, r:24});
    txt(h, x + 270, 295, {size:40, weight:900, color:i === 2 ? C.mint : C.text, alpha:pa[i]});
    txt(d1, x + 270, 730, {size:26, weight:700, alpha:pa[i]}); txt(d2, x + 270, 775, {size:26, weight:700, color:c, alpha:pa[i]});
  });
  // 哈希
  for (let i = 0; i < 6; i++){ box(170, 360 + i*55, 120, 44, pa[0], {stroke:'rgba(251,146,60,.4)', r:6}); txt('桶 ' + i, 230, 382 + i*55, {size:20, weight:700, font:MONO, alpha:pa[0]}); }
  [['id=30', 0], ['id=31', 4], ['id=32', 2]].forEach(([s, b], i) => { arrow(310, 382 + b*55, 400, 382 + b*55, pa[0], pa[0], C.acc, 2); txt(s, 420, 382 + b*55, {size:22, weight:700, font:MONO, align:'left', alpha:pa[0]}); });
  txt('相邻的键，散落在不同的桶', 390, 690, {size:22, weight:600, color:C.muted, alpha:pa[0]});
  // 二叉树（高）
  const bx = 990; const pts = []; for (let d = 0; d < 7; d++) pts.push([bx - 160 + d*48, 360 + d*48]);
  pts.forEach(([x, y], i) => { if (i) { ctx.save(); al(pa[1]*.6); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(x, y); ctx.stroke(); ctx.restore(); }
    ctx.save(); al(pa[1]); ctx.fillStyle = 'rgba(255,138,138,.3)'; ctx.strokeStyle = C.rose; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 16, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.restore(); });
  txt('7 层 = 7 次磁盘 IO', bx + 110, 470, {size:24, weight:800, color:C.rose, alpha:pa[1]});
  // B+ 树（矮胖）
  const tx = 1570;
  box(tx - 140, 360, 280, 44, pa[2], {fill:'rgba(110,231,200,.15)', stroke:C.mint, r:8});
  for (let i = 0; i < 5; i++){ ctx.save(); al(pa[2]*.6); ctx.strokeStyle = C.mint; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(tx - 120 + i*60, 404); ctx.lineTo(tx - 220 + i*110, 500); ctx.stroke(); ctx.restore();
    box(tx - 250 + i*110, 500, 60, 36, pa[2], {stroke:'rgba(110,231,200,.5)', r:6}); }
  txt('…', tx, 470, {size:28, weight:900, color:C.mint, alpha:pa[2]});
  for (let i = 0; i < 10; i++) box(tx - 260 + i*53, 590, 44, 30, pa[2]*.8, {fill:'rgba(110,231,200,.08)', stroke:'rgba(110,231,200,.35)', r:5});
  txt('3 层 = 3 次磁盘 IO', tx, 660, {size:24, weight:800, color:C.mint, alpha:pa[2]});
  rise('树越矮，查询需要的磁盘 IO 越少', W/2, 920, t, 15.4, {size:40, weight:900, color:C.acc});
}

/* ============ 场景 3 · B+ 树查找 (20–38s) ============ */
function s3(t){
  rise('B+ 树：查找 id = 37', W/2, 100, t, 20.2, {size:56, weight:900});
  const a = eo(p(t, 20.6, 21.4));
  const path = []; if (t > 23.4) path.push('r'); if (t > 24.8) path.push('m1'); if (t > 26.2) path.push('l3');
  drawTree(t, a, {path, hits:t > 26.8 ? {3:2} : {}, linkA:eo(p(t, 21.6, 22.2))});
  txt('根节点 / 内部节点：只存「键 + 指针」', 300, 330, {size:24, weight:700, color:C.acc, align:'left', alpha:eo(p(t, 21.8, 22.3))*(1 - p(t, 23.2, 23.4))});
  txt('叶子节点：存数据，并用链表串起来', 960, 730, {size:26, weight:700, color:C.mint, alpha:eo(p(t, 22.4, 22.9))});
  [['37 在 30 和 60 之间 → 走中间', 23.4, 1200, 230], ['37 < 40 → 走左边', 24.8, 1260, 420], ['在叶子里找到 37 ✓', 26.4, 960, 560]].forEach(([s, ts, x, y]) =>
    txt(s, x, y, {size:26, weight:800, color:C.gold, align:x === 960 ? 'center' : 'left', alpha:eo(p(t, ts, ts + .4))}));
  [['第 1 次 IO', 23.4, 230], ['第 2 次 IO', 24.8, 420], ['第 3 次 IO', 26.2, 570]].forEach(([s, ts, y]) => pill(s, 1820, y, eo(p(t, ts, ts + .4)), {size:22, color:C.acc, stroke:C.acc}));
  rise('InnoDB 的一个节点就是一个 16KB 的「页」，一页能放上千个键', W/2, 840, t, 28.4, {size:38, weight:900});
  rise('按每行 1KB 估算，3 层 B+ 树大约就能存下 2000 万行', W/2, 910, t, 30.6, {size:34, weight:700, color:C.acc});
  rise('从上百万行里找一行，只要 3 次磁盘读取', W/2, 975, t, 32.6, {size:30, weight:600, color:C.muted});
}

/* ============ 场景 4 · 范围查询 (38–52s) ============ */
function s4(t){
  rise('范围查询：叶子之间的链表立功了', W/2, 100, t, 38.2, {size:56, weight:900});
  pill('WHERE id BETWEEN 30 AND 60', W/2, 175, eo(p(t, 38.8, 39.3)), {size:28, font:MONO, color:C.acc, stroke:C.acc});
  const a = eo(p(t, 38.6, 39.2));
  const path = []; if (t > 40) path.push('r'); if (t > 40.8) path.push('m1'); if (t > 41.6) path.push('l3');
  const sweep = clamp((t - 42.6)/3.6), leafOn = []; [3, 4, 5, 6].forEach((i, k) => { if (sweep > k*.27) leafOn.push(i); });
  drawTree(t, a, {path, leafOn, ry:290, my:470, ly:680});
  if (t > 42.6 && t < 46.8){ const x = lerp(LX(3), LX(6) - 60, eio(sweep)); ctx.save(); al(1); ctx.fillStyle = C.gold; ctx.shadowColor = C.gold; ctx.shadowBlur = 24; ctx.beginPath(); ctx.arc(x, 740, 12, 0, 6.283); ctx.fill(); ctx.restore(); }
  txt('先定位到 30', LX(3), 770, {size:24, weight:800, color:C.gold, alpha:eo(p(t, 41.8, 42.2))});
  txt('再沿链表向右扫，遇到 60 停下', (LX(4) + LX(6))/2, 800, {size:24, weight:800, color:C.gold, alpha:eo(p(t, 44, 44.4))});
  rise('不用回到上层节点反复查找，范围查询和排序都很高效', W/2, 900, t, 47.2, {size:38, weight:900});
  rise('这也是 B+ 树相比 B 树的一大优势：数据全在叶子上，且叶子相连', W/2, 965, t, 48.8, {size:30, weight:600, color:C.muted});
}

/* ============ 场景 5 · 聚簇索引与回表 (52–66s) ============ */
function miniTree(cx, top, a, color, leaves, label, sub){
  box(cx - 60, top, 120, 40, a, {fill:'rgba(255,255,255,.06)', stroke:color, r:8});
  [-1, 0, 1].forEach(k => { ctx.save(); al(a*.5); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx + k*30, top + 40); ctx.lineTo(cx + k*130, top + 110); ctx.stroke(); ctx.restore();
    box(cx + k*130 - 45, top + 110, 90, 34, a, {stroke:color, r:6}); });
  txt(label, cx, top - 40, {size:32, weight:900, color, alpha:a}); txt(sub, cx, top - 6 - 0, {size:22, weight:500, color:C.muted, alpha:a*0});
  leaves.forEach((s, i) => { box(cx - 300, top + 190 + i*58, 600, 48, a, {fill:'rgba(255,255,255,.04)', stroke:'rgba(255,255,255,.15)', r:8});
    txt(s, cx, top + 214 + i*58, {size:22, weight:600, font:MONO, alpha:a}); });
}
function s5(t){
  rise('主键索引、二级索引和「回表」', W/2, 100, t, 52.2, {size:56, weight:900});
  const a1 = eo(p(t, 52.8, 53.3)), a2 = eo(p(t, 53.6, 54.1));

  txt('叶子里存整行数据', 1400, 590, {size:22, weight:700, color:C.acc, alpha:a1*0});
  miniTree(520, 290, a2, C.mint, ['name=李四 → id=3', 'name=王五 → id=9', 'name=张三 → id=5'], '二级索引（name）', '');
  txt('叶子里只存：索引列 + 主键', 520, 700, {size:24, weight:700, color:C.mint, alpha:a2});
  txt('叶子里存整行数据', 1400, 700, {size:24, weight:700, color:C.acc, alpha:a1});
  pill("SELECT * FROM user WHERE name = '张三'", W/2, 195, eo(p(t, 54.6, 55.1)), {size:26, font:MONO, color:C.gold, stroke:C.gold});
  const s1 = eo(p(t, 55.8, 56.3));
  box(220, 595, 600, 48, s1, {fill:'rgba(0,0,0,0)', stroke:C.gold, lw:3, glow:16, r:8});
  txt('① 在二级索引里找到 id = 5', 520, 770, {size:26, weight:800, color:C.gold, alpha:s1});
  const s2 = eo(p(t, 57.4, 58.2));
  if (s2 > 0){ ctx.save(); al(1); ctx.strokeStyle = C.gold; ctx.lineWidth = 4; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.moveTo(820, 619); ctx.quadraticCurveTo(960, 560, lerp(820, 1100, s2), lerp(619, 561, s2)); ctx.stroke(); ctx.restore(); }
  const s3 = eo(p(t, 58.2, 58.7));
  box(1100, 537, 600, 48, s3, {fill:'rgba(0,0,0,0)', stroke:C.gold, lw:3, glow:16, r:8});
  txt('② 拿 id 回到主键索引取整行：这就叫「回表」', 1400, 770, {size:26, weight:800, color:C.gold, alpha:s3});
  rise("如果只查 SELECT id, name，二级索引里就有，不用回表——这叫「覆盖索引」", W/2, 880, t, 60.4, {size:34, weight:900, color:C.mint});
  rise('所以：少用 SELECT *，只查需要的列', W/2, 950, t, 62.0, {size:30, weight:700, color:C.muted});
}

/* ============ 场景 6 · 最左前缀与失效 (66–75s) ============ */
const IDX = [['北京', 22], ['北京', 25], ['北京', 31], ['上海', 20], ['上海', 25], ['上海', 28], ['深圳', 23], ['深圳', 25]];
const FAIL = [['跳过最左列', 'INDEX(city, age) 却只查 age'], ['左模糊匹配', "name LIKE '%三'"], ['对索引列做计算', 'WHERE YEAR(created_at) = 2026'], ['隐式类型转换', "字符串列 phone = 13800000000"]];
function s6(t){
  rise('联合索引的「最左前缀」与索引失效', W/2, 100, t, 66.2, {size:54, weight:900});
  const a = eo(p(t, 66.6, 67.1));

    txt(c, 330, y, {size:26, weight:800, alpha:a}); txt(String(g), 610, y, {size:26, weight:800, font:MONO, color:hl ? C.rose : C.text, alpha:a}); });

  FAIL.forEach(([h, d], i) => { const st = 68.6 + i*.5, e = eo(p(t, st, st + .4)), y = 220 + i*150;
    box(900, y - 55, 880, 120, e, {fill:'rgba(255,138,138,.06)', stroke:'rgba(255,138,138,.4)', r:18});
    txt('✗ ' + h, 940, y - 18, {size:30, weight:900, color:C.rose, align:'left', alpha:e}); txt(d, 940, y + 28, {size:24, weight:600, font:MONO, color:C.muted, align:'left', alpha:e}); });
  rise('索引能不能用，关键看：数据在 B+ 树里是不是按这个顺序排好的', W/2, 900, t, 71.4, {size:34, weight:900, color:C.gold});
}

/* ============ 场景 7 · 收尾 (75–80s) ============ */
function s7(t){
  [['矮胖', '3 层存千万行'], ['叶子相连', '范围查询高效'], ['按序排列', '用对才生效']].forEach(([a, b], i) => {
    const st = 75.2 + i*.4, e = eback(p(t, st, st + .6)); if (e <= 0) return;

  });

}

/* ============ 总调度 ============ */
const SCENES = [[s1,-1,7],[s2,7,20],[s3,20,38],[s4,38,52],[s5,52,66],[s6,66,75],[s7,75,80]];
function draw(t){
  t = clamp(t, 0, DUR);
  ctx.save(); ctx.globalAlpha = 1; ctx.clearRect(0,0,W,H); background(t);
  for (const [fn,a,b] of SCENES){
    if (t < a || t > b) continue;
    SA = sceneA(t, a, b, b === DUR ? .8 : .5);
    if (SA > 0){ ctx.save(); fn(t); ctx.restore(); }
  }
  SA = 1; vignette();
  const fo = p(t, DUR - .8, DUR);
  if (fo > 0){ ctx.globalAlpha = fo; ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}

/* ============ 播放器 / 逐帧渲染接口 ============ */
const isRender = new URLSearchParams(location.search).has('render');
window.DURATION = DUR;
window.renderFrame = t => draw(t);
const btn = document.getElementById('btn'), seek = document.getElementById('seek'), timeEl = document.getElementById('time');
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function fit(){
  if (isRender){ cv.style.width = W+'px'; cv.style.height = H+'px'; return; }
  const w = Math.min(innerWidth - 32, (innerHeight - 84)*16/9);
  cv.style.width = w + 'px'; cv.style.height = w*9/16 + 'px';
}
addEventListener('resize', fit); fit();

let cur = 0, playing = !isRender, last = null;
function toggle(){ if (cur >= DUR) cur = 0; playing = !playing; }
btn.onclick = toggle; cv.onclick = toggle;
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); toggle(); } });
seek.oninput = () => { cur = +seek.value; draw(cur); };
function loop(ts){
  if (playing && last != null){ cur += (ts - last)/1000; if (cur >= DUR){ cur = DUR; playing = false; } }
  last = ts; draw(cur);
  seek.value = cur; timeEl.textContent = `${fmt(cur)} / ${fmt(DUR)}`;
  btn.textContent = playing ? '❚❚' : (cur >= DUR ? '↺' : '▶');
  requestAnimationFrame(loop);
}
document.fonts.ready.then(() => {
  window.ready = true;
  if (isRender) draw(0); else requestAnimationFrame(loop);
});
</script>
