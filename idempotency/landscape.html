<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幂等性设计：重复请求不出错 · 拾星</title>
<style>
  :root{--bg:#07080f;--fg:#f4ede4;--muted:#9a93a8;--acc:#bef264}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
  #stage{display:block;background:#07080f;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);cursor:pointer}
  #bar{display:flex;align-items:center;gap:12px;width:min(calc(100vw - 32px),640px)}
  #btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(190,242,100,.5);background:transparent;
    color:var(--acc);font-size:16px;cursor:pointer;flex:none}
  #seek{flex:1;accent-color:var(--acc)}
  #time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:84px;text-align:right}
  body.render{display:block}
  body.render #bar{display:none}
  body.render #stage{border-radius:0;box-shadow:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bar">
  <button id="btn" aria-label="播放/暂停">❚❚</button>
  <input id="seek" type="range" min="0" max="82" step="0.01" value="0">
  <span id="time">0:00 / 1:22</span>
</div>
<script>
/* ============ 基础设置（横屏 1920×1080） ============ */
const W = 1920, H = 1080, DUR = 82;
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const FONT = '"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif';
const MONO = '"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono CJK SC","PingFang SC","Microsoft YaHei",monospace';
const C = {acc:'#bef264', mint:'#6ee7c8', gold:'#ffd38a', coral:'#ff9e7a', rose:'#ff8a8a', blue:'#9cc3ff', text:'#f4ede4', muted:'#9a93a8', dim:'#4a4558', panel:'#0f0e1f'};

const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const p = (t,a,b) => clamp((t-a)/(b-a));
const eo = x => 1 - Math.pow(1-x, 3);
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const eback = x => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
function rnd(seed){ let s = seed>>>0; return () => { s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }

let SA = 1;
const al = a => { ctx.globalAlpha = clamp(SA*a); };
const sceneA = (t,a,b,f=.5) => Math.min(p(t,a,a+f), 1 - p(t,b-f,b));

function txt(s, x, y, o = {}){
  const {size=64, weight=700, color=C.text, alpha=1, align='center', glow=0, scale=1, font=FONT} = o;
  if (alpha <= 0) return;
  ctx.save(); al(alpha);
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (glow){ ctx.shadowColor = color; ctx.shadowBlur = glow; }
  if (scale !== 1){ ctx.translate(x, y); ctx.scale(scale, scale); ctx.fillText(s, 0, 0); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}
function rise(s, x, y, t, t0, o = {}, d = .7){
  const e = eo(p(t, t0, t0+d));
  if (e <= 0) return;
  txt(s, x, y + (1-e)*36, {...o, alpha:(o.alpha ?? 1)*e});
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function box(x, y, w, h, a, o = {}){
  const {fill='rgba(255,255,255,.05)', stroke='rgba(190,242,100,.35)', lw=2, glow=0, r=18, dash=null} = o;
  if (a <= 0) return;
  ctx.save(); al(a); rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (dash) ctx.setLineDash(dash);
  ctx.strokeStyle = stroke; ctx.lineWidth = lw; if (glow){ ctx.shadowColor = stroke; ctx.shadowBlur = glow; } ctx.stroke(); ctx.restore();
}
function arrow(x1, y1, x2, y2, e, a, color = C.acc, lw = 3){
  if (e <= 0 || a <= 0) return;
  const x = lerp(x1, x2, e), y = lerp(y1, y2, e), ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); al(a); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  if (e > .85){ ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-14, -9); ctx.lineTo(-14, 9); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function panel(x, y, w, h, title, a){
  box(x, y, w, h, a, {fill:C.panel, stroke:'rgba(255,255,255,.1)', r:20});
  if (a <= 0) return;
  ctx.save(); al(a); ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + 52); ctx.lineTo(x + w, y + 52); ctx.stroke();
  ['#ff6b6b','#ffd166','#6ee7a0'].forEach((c, i) => { ctx.fillStyle = c; ctx.globalAlpha = clamp(SA*a*.8); ctx.beginPath(); ctx.arc(x + 30 + i*24, y + 26, 7, 0, 6.283); ctx.fill(); });
  ctx.restore();
  txt(title, x + w/2, y + 27, {size:22, weight:500, color:C.muted, font:MONO, alpha:a});
}

/* ============ 背景 ============ */
const PARTS = (() => { const r = rnd(331); return Array.from({length:100}, () => ({
  x:r()*W, y:r()*H, s:r()*2.2+.5, v:r()*12+4, ph:r()*6.283, c:r()<.25})); })();
function background(t){
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0a0916'); g.addColorStop(.55,'#110f24'); g.addColorStop(1,'#18122c');
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const gx = W*.5 + Math.sin(t*.27)*140;
  const rg = ctx.createRadialGradient(gx, H*.45, 0, gx, H*.45, 950);
  rg.addColorStop(0,'rgba(190,242,100,0.09)'); rg.addColorStop(1,'rgba(190,242,100,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = C.acc;
  for (let x = 40; x < W; x += 80) for (let y = 40; y < H; y += 80){ ctx.globalAlpha = .06; ctx.fillRect(x, y, 2, 2); }
  for (const q of PARTS){
    const y = ((q.y - t*q.v) % H + H) % H, x = q.x + Math.sin(t*.35 + q.ph)*12;
    ctx.globalAlpha = .2 + .3*(.5 + .5*Math.sin(t*1.2 + q.ph));
    ctx.fillStyle = q.c ? C.acc : '#d8d0ff';
    ctx.beginPath(); ctx.arc(x, y, q.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function vignette(){
  const v = ctx.createRadialGradient(W/2, H/2, W*.28, W/2, H/2, W*.62);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.globalAlpha = 1; ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}
function codeLine(s, x, y, size, a, kw = /\b(public|class|static|void|new|return)\b/){
  const parts = s.split(/("[^"]*"|\b(?:public|class|static|void|new|return|getstatic|ldc|invokevirtual)\b)/g);
  ctx.save(); al(a); ctx.font = `500 ${size}px ${MONO}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  let xx = x;
  for (const seg of parts){ if (!seg) continue;
    ctx.fillStyle = seg.startsWith('"') ? C.mint : /^(public|class|static|void|new|return|getstatic|ldc|invokevirtual)$/.test(seg) ? C.acc : C.text;
    ctx.fillText(seg, xx, y); xx += ctx.measureText(seg).width; }
  ctx.restore();
}

function card(h, lines, x, y, w, hh, a, c = C.acc, o = {}){
  const {hs=30, ls=22, lh=40, font=FONT, t0=null, t=0} = o;
  box(x, y, w, hh, a, {fill:'rgba(190,242,100,.05)', stroke:c === C.acc ? 'rgba(190,242,100,.5)' : c, r:20});
  txt(h, x + 30, y + 44, {size:hs, weight:900, color:c, align:'left', alpha:a});
  lines.forEach((s, i) => { const e = t0 == null ? a : Math.min(a, eo(p(t, t0 + i*.4, t0 + i*.4 + .4)));
    txt(s, x + 30, y + 96 + i*lh, {size:ls, weight:600, color:'#e2e6d6', align:'left', alpha:e, font}); });
}
function node(label, sub, x, y, a, c = C.text, w = 240, h = 120){
  box(x - w/2, y - h/2, w, h, a, {fill:'rgba(255,255,255,.05)', stroke:'rgba(255,255,255,.3)', r:20});
  txt(label, x, y - (sub ? 14 : 0), {size:30, weight:900, color:c, alpha:a});
  if (sub) txt(sub, x, y + 28, {size:19, weight:600, color:C.muted, alpha:a});
}
function packet(s, x, y, a, c, w = 260){
  box(x - w/2, y - 28, w, 56, a, {fill:'rgba(20,18,36,.92)', stroke:c, r:14});
  txt(s, x, y, {size:21, weight:700, font:MONO, color:c, alpha:a});
}
function chip(s, x, y, a, c = C.text, o = {}){
  const {size=22, font=FONT, weight=700, pad=18} = o;
  if (a <= 0) return;
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; const w = ctx.measureText(s).width + pad*2; ctx.restore();
  box(x - w/2, y - size*.95, w, size*1.9, a, {fill:'#141428', stroke:c === C.text ? 'rgba(255,255,255,.25)' : c, r:12});
  txt(s, x, y, {size, weight, color:c, alpha:a, font});
}
function vline(x, y1, y2, a){
  if (a <= 0) return;
  ctx.save(); al(a); ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);
  ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke(); ctx.restore();
}
function code(title, lines, x, y, w, h, a, t, t0, size = 24, lh = 44){
  panel(x, y, w, h, title, a);
  lines.forEach(([s, c], i) => txt(s, x + 36, y + 96 + i*lh, {size, weight:600, font:MONO, color:c || C.text, align:'left', alpha:Math.min(a, eo(p(t, t0 + i*.25, t0 + i*.25 + .4)))}));
}

/* ============ 场景 1 · 钩子：点了三次，扣了三次 (0–7s) ============ */
function s1(t){
  rise('网络一卡，用户连点三次「支付」，钱扣了三次', W/2, 110, t, .2, {size:52, weight:900});
  const a = eo(p(t, .6, 1.1));
  box(200, 220, 380, 620, a, {fill:'rgba(255,255,255,.04)', stroke:'rgba(255,255,255,.3)', r:44});
  txt('订单 A1001', 390, 320, {size:28, weight:800, color:C.muted, alpha:a});
  txt('¥ 99.00', 390, 420, {size:60, weight:900, alpha:a});
  txt('加载中…', 390, 520, {size:24, weight:700, color:C.gold, alpha:a*(.5 + .5*Math.sin(t*6))});
  box(250, 650, 280, 90, a, {fill:'rgba(190,242,100,.18)', stroke:C.acc, r:20});
  txt('立即支付', 390, 695, {size:32, weight:900, color:C.acc, alpha:a});
  [1.3, 1.9, 2.5].forEach((ts, i) => { const k = p(t, ts, ts + .6);
    if (k > 0 && k < 1){ ctx.save(); al(1 - k); ctx.strokeStyle = C.acc; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(390, 695, 30 + k*90, 0, 6.283); ctx.stroke(); ctx.restore(); }
    txt('×' + (i + 1), 470 + i*0, 790, {size:30, weight:900, color:C.gold, alpha:t >= ts && t < [1.9, 2.5, 99][i] ? 1 : 0});
    const m = p(t, ts + .1, ts + 1.1);
    if (m > 0 && m < 1) packet('POST /pay', lerp(720, 920, eio(m)), 410 + i*90, clamp(m*5), C.text, 200);
  });
  ctx.save(); al(a*.6); ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.setLineDash([10, 10]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(600, 500); ctx.lineTo(1030, 500); ctx.stroke(); ctx.restore();
  node('支付服务', '', 1160, 500, a, C.text, 240, 120);
  panel(1380, 220, 420, 460, 'account_log', eo(p(t, .9, 1.4)));
  [2.4, 3.0, 3.6].forEach((ts, i) => { const e = eo(p(t, ts, ts + .4));
    txt('用户 42', 1420, 330 + i*70, {size:24, weight:700, color:C.muted, align:'left', alpha:e});
    txt('- ¥99.00', 1760, 330 + i*70, {size:28, weight:900, font:MONO, color:C.rose, align:'right', alpha:e}); });
  const s = eo(p(t, 4.2, 4.6));
  ctx.save(); al(s); ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(1410, 545); ctx.lineTo(1770, 545); ctx.stroke(); ctx.restore();
  txt('合计', 1420, 600, {size:26, weight:800, alpha:s, align:'left'}); txt('- ¥297.00', 1760, 600, {size:34, weight:900, font:MONO, color:C.rose, align:'right', alpha:s, glow:12});
  rise('重复请求是常态，不是意外：写接口必须「幂等」', W/2, 960, t, 5, {size:38, weight:900, color:C.acc});
}

/* ============ 场景 2 · 重复请求从哪来 (7–18s) ============ */
function s2(t){
  rise('重复请求从哪来？', W/2, 90, t, 7.2, {size:56, weight:900});
  const a = eo(p(t, 7.6, 8.1)), cx = 200, sx = 820;
  txt('客户端', cx, 180, {size:30, weight:900, alpha:a}); txt('服务端', sx, 180, {size:30, weight:900, alpha:a});
  vline(cx, 210, 740, a); vline(sx, 210, 740, a);
  const e1 = eo(p(t, 7.9, 8.6));
  arrow(cx + 12, 270, sx - 12, 270, e1, clamp(p(t, 7.9, 8.2)), C.text, 3); txt('① 扣款请求', 510, 240, {size:26, weight:800, alpha:clamp(p(t, 7.9, 8.2))});
  chip('✓ 扣款成功', sx, 340, eo(p(t, 8.6, 9)), C.mint, {size:22});
  const e2 = eo(p(t, 9.2, 9.8));
  arrow(sx - 12, 420, lerp(sx - 12, 540, 1), 420, e2, clamp(p(t, 9.2, 9.5)), C.muted, 3);
  txt('② 响应', 690, 390, {size:24, weight:800, color:C.muted, alpha:clamp(p(t, 9.2, 9.5))});
  txt('✗', 510, 420, {size:52, weight:900, color:C.rose, alpha:eo(p(t, 9.7, 10))}); txt('丢包 / 超时', 380, 420, {size:22, weight:700, color:C.rose, alpha:eo(p(t, 9.8, 10.1))});
  chip('等不到响应…', cx, 500, eo(p(t, 10.2, 10.6)), C.gold, {size:22});
  const e3 = eo(p(t, 10.8, 11.4));
  arrow(cx + 12, 580, sx - 12, 580, e3, clamp(p(t, 10.8, 11.1)), C.gold, 3); txt('③ 重试', 510, 550, {size:26, weight:800, color:C.gold, alpha:clamp(p(t, 10.8, 11.1))});
  chip('✗ 又扣了一次', sx, 660, eo(p(t, 11.5, 11.9)), C.rose, {size:22});
  [['用户连点 / 刷新重提交', '按钮没防抖，页面一卡就多点几下'], ['超时重试', '请求其实成功了，只是响应丢了'], ['网关、RPC 框架自动重试', '对超时或失败的调用自动再发一次'], ['MQ「至少一次」投递', '消费成功但确认没送达，消息会再来']].forEach(([h, d], i) =>
    card(h, [d], 1000, 170 + i*155, 800, 135, eo(p(t, 8.4 + i*.9, 8.9 + i*.9)), C.acc, {hs:28, ls:23}));
  const k = eo(p(t, 13.6, 14.1));
  box(120, 820, 1680, 170, k, {fill:'rgba(255,211,138,.08)', stroke:C.gold, r:24});
  txt('客户端分不清「没执行」和「执行了但响应丢了」，只能重试', W/2, 875, {size:32, weight:900, color:C.gold, alpha:k});
  txt('所以服务端必须扛得住重复：同一个操作，执行多少次都只生效一次', W/2, 940, {size:26, weight:700, alpha:eo(p(t, 14.6, 15.1))});
}

/* ============ 场景 3 · 幂等的定义 (18–29s) ============ */
function s3(t){
  rise('幂等：执行一次和执行多次，效果相同', W/2, 90, t, 18.2, {size:54, weight:900});
  rise('f(f(x)) = f(x)', W/2, 165, t, 18.7, {size:34, weight:700, font:MONO, color:C.acc});
  [['余额 = 100', '✓ 幂等：执行几次，余额都是 100', C.mint], ['余额 = 余额 + 100', '✗ 不幂等：执行三次，多加了 200', C.rose], ['DELETE 订单 A1001', '✓ 幂等：删一次、删三次，结果都是「不存在」', C.mint]].forEach(([s, d, c], i) => {
    const e = eo(p(t, 19.2 + i*.9, 19.7 + i*.9)), y = 240 + i*160;
    box(120, y, 820, 135, e, {fill:'rgba(255,255,255,.04)', stroke:'rgba(255,255,255,.22)', r:18});
    txt(s, 150, y + 42, {size:28, weight:800, font:MONO, align:'left', alpha:e});
    txt(d, 150, y + 96, {size:24, weight:800, color:c, align:'left', alpha:eo(p(t, 19.6 + i*.9, 20 + i*.9))}); });
  const a = eo(p(t, 22.2, 22.7));
  box(1000, 240, 800, 455, a, {fill:'rgba(255,255,255,.03)', stroke:'rgba(255,255,255,.2)', r:20});
  txt('HTTP 方法', 1040, 290, {size:28, weight:900, color:C.acc, align:'left', alpha:a});
  [['GET', '✓', '只读取', C.mint], ['PUT', '✓', '整体替换成同一个值', C.mint], ['DELETE', '✓', '删完都是「不存在」', C.mint], ['POST', '✗', '通常每次都创建新资源', C.rose], ['PATCH', '？', '不保证，取决于实现', C.gold]].forEach(([m, ok, d, c], i) => {
    const e = eo(p(t, 22.6 + i*.35, 23 + i*.35)), y = 360 + i*68;
    txt(m, 1040, y, {size:26, weight:800, font:MONO, align:'left', alpha:e});
    txt(ok, 1230, y, {size:30, weight:900, color:c, alpha:e});
    txt(d, 1300, y, {size:24, weight:700, color:'#e2e6d6', align:'left', alpha:e}); });
  rise('看的是服务端状态的「效果」，不是响应：第二次 DELETE 返回 404 也算幂等', W/2, 800, t, 25, {size:28, weight:800, color:C.gold});
  rise('读接口天然幂等；真正要设计的是「写」：下单、扣款、发券、发消息', W/2, 880, t, 26, {size:28, weight:700});
}

/* ============ 场景 4 · 唯一约束与 Token (29–41s) ============ */
function s4(t){
  rise('方案一：唯一约束　　方案二：防重 Token', W/2, 90, t, 29.2, {size:52, weight:900});
  const a = eo(p(t, 29.6, 30.1));
  box(100, 160, 840, 830, a, {fill:'rgba(255,255,255,.025)', stroke:'rgba(255,255,255,.15)', r:24});
  box(980, 160, 840, 830, eo(p(t, 34.4, 34.9)), {fill:'rgba(255,255,255,.025)', stroke:'rgba(255,255,255,.15)', r:24});
  txt('唯一索引 / 去重表', 520, 210, {size:32, weight:900, color:C.acc, alpha:a});
  [['请求 1', 300], ['请求 2', 740]].forEach(([s, x], i) => { const e = eo(p(t, 30.2 + i*.2, 30.6 + i*.2));
    chip(s + '：INSERT A1001', x, 290, e, C.text, {size:21});
    arrow(x, 320, 520 + (i ? 60 : -60), 395, eo(p(t, 30.6, 31.1)), e, C.text, 3); });
  const d = eo(p(t, 31, 31.5));
  box(330, 400, 380, 120, d, {fill:'rgba(190,242,100,.10)', stroke:C.acc, r:18});
  txt('orders 表', 520, 440, {size:28, weight:900, alpha:d}); txt('UNIQUE (order_no)', 520, 485, {size:22, weight:700, font:MONO, color:C.acc, alpha:d});
  txt('✓ 请求 1：插入成功', 150, 580, {size:26, weight:800, color:C.mint, align:'left', alpha:eo(p(t, 31.6, 32))});
  txt('✗ 请求 2：Duplicate key，被数据库挡下', 150, 635, {size:26, weight:800, color:C.rose, align:'left', alpha:eo(p(t, 32, 32.4))});

/* ============ 总调度 ============ */
const SCENES = [[s1,-1,7],[s2,7,18],[s3,18,29],[s4,29,41],[s5,41,52],[s6,52,64],[s7,64,76],[s8,76,82]];
function draw(t){
  t = clamp(t, 0, DUR);
  ctx.save(); ctx.globalAlpha = 1; ctx.clearRect(0,0,W,H); background(t);
  for (const [fn,a,b] of SCENES){
    if (t < a || t > b) continue;
    SA = sceneA(t, a, b, b === DUR ? .8 : .5);
    if (SA > 0){ ctx.save(); fn(t); ctx.restore(); }
  }
  SA = 1; vignette();
  const fo = p(t, DUR - .8, DUR);
  if (fo > 0){ ctx.globalAlpha = fo; ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}

/* ============ 播放器 / 逐帧渲染接口 ============ */
const isRender = new URLSearchParams(location.search).has('render');
window.DURATION = DUR;
window.renderFrame = t => draw(t);
const btn = document.getElementById('btn'), seek = document.getElementById('seek'), timeEl = document.getElementById('time');
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function fit(){
  if (isRender){ cv.style.width = W+'px'; cv.style.height = H+'px'; return; }
  const w = Math.min(innerWidth - 32, (innerHeight - 84)*16/9);
  cv.style.width = w + 'px'; cv.style.height = w*9/16 + 'px';
}
addEventListener('resize', fit); fit();

let cur = 0, playing = !isRender, last = null;
function toggle(){ if (cur >= DUR) cur = 0; playing = !playing; }
btn.onclick = toggle; cv.onclick = toggle;
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); toggle(); } });
seek.oninput = () => { cur = +seek.value; draw(cur); };
function loop(ts){
  if (playing && last != null){ cur += (ts - last)/1000; if (cur >= DUR){ cur = DUR; playing = false; } }
  last = ts; draw(cur);
  seek.value = cur; timeEl.textContent = `${fmt(cur)} / ${fmt(DUR)}`;
  btn.textContent = playing ? '❚❚' : (cur >= DUR ? '↺' : '▶');
  requestAnimationFrame(loop);
}
document.fonts.ready.then(() => {
  window.ready = true;
  if (isRender) draw(0); else requestAnimationFrame(loop);
});
</script>
