<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾星 · 用代码画出看得懂的原理</title>
<meta name="description" content="拾星：用代码绘制的科普动画与图文详解，覆盖 AI、计算机与后端、心理学。">
<style>
  :root{--bg:#0b0c17;--card:#14142a;--fg:#f4ede4;--muted:#9a93a8;--line:rgba(255,255,255,.08);--chip:#1b1b33}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    min-height:100vh;padding:48px 16px 64px}
  main{max-width:960px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .logo{width:64px;height:64px;flex:none}
  h1{font-size:38px;margin:0;letter-spacing:.08em}
  .slogan{margin:2px 0 0;color:#ffd38a;font-size:16px;letter-spacing:.04em}
  p.sub{color:var(--muted);margin:0 0 28px;line-height:1.6}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .tab{border:1px solid var(--line);background:var(--chip);color:var(--muted);padding:8px 16px;border-radius:999px;
    font-size:15px;cursor:pointer;font-family:inherit}
  .tab.on{color:var(--fg);border-color:rgba(255,255,255,.35)}
  .tab .n{opacity:.6;margin-left:4px}
  section{margin-top:28px}
  section h2{font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
  section h2 small{font-size:14px;color:var(--muted);font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .card{padding:18px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line);
    color:var(--fg);transition:border-color .2s;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .card:hover{border-color:var(--accent)}
  .card b{display:block;font-size:18px;margin-bottom:6px}
  .card .d{color:var(--muted);font-size:14px;line-height:1.5;display:block;margin-bottom:14px;flex:1}
  .card .acts{display:flex;gap:8px}
  .card .acts a{flex:1;text-align:center;padding:8px 10px;border-radius:10px;font-size:14px;text-decoration:none;font-weight:600}
  .card .play{background:var(--accent);color:#14121f}
  .card .read{border:1px solid var(--accent);color:var(--accent)}
  .card .read.off{border-color:var(--line);color:var(--muted);pointer-events:none}
  footer{margin-top:48px;color:var(--muted);font-size:13px;line-height:1.7}
  code{background:var(--chip);padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<main>
  <header class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff3d6"/><stop offset=".45" stop-color="#ffd38a"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(#g)" opacity=".35"/><path d="M32 8 L37 27 L56 32 L37 37 L32 56 L27 37 L8 32 L27 27 Z" fill="#ffd38a"/><circle cx="32" cy="32" r="5" fill="#fff8e7"/></svg>
    <div><h1>拾星</h1><p class="slogan">用代码，画出看得懂的原理</p></div>
  </header>
  <p class="sub">每一部都是用代码一帧一帧画出来的科普动画，并配一篇图文详解。点击画面或按空格键暂停，底部可以拖动进度。</p>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <footer>拾星 · 用代码，画出看得懂的原理<br>导出 MP4：<code>node render.mjs &lt;html&gt; &lt;out.mp4&gt;</code>，详见 README。</footer>
</main>
<script>
const CATS = [
  {id:'ai', name:'AI 与大模型', desc:'大模型原理与应用'},
  {id:'cs', name:'计算机与后端', desc:'计算机基础与后端技术'},
  {id:'psy', name:'心理学 · 人生', desc:'心理与成长'}
];
// 新增视频只需在这里加一行
const VIDEOS = [
  {cat:'ai',  title:'什么是 LLM',            desc:'猜下一个词、训练、注意力机制',         path:'llm/landscape.html',             dur:72, color:'#6ee7c8'},
  {cat:'ai',  title:'从零做一个 Claude Code', desc:'大模型 + 工具 + 循环，十几行核心代码', path:'claude-code/landscape.html',     dur:84, color:'#ff9e7a'},
  {cat:'cs',  title:'JVM 是什么',            desc:'字节码、内存区域、垃圾回收、JIT',      path:'jvm/landscape.html',             dur:72, color:'#b39dff'},
  {cat:'psy', title:'幸福的科学',            desc:'享乐适应、哈佛成人发展研究、心流',      path:'happiness/landscape.html',       dur:72, color:'#ffb36b'},
  {cat:'psy', title:'人生的意义',            desc:'弗兰克尔、意义的三个来源、快乐≠意义',  path:'meaning-of-life/landscape.html', dur:72, color:'#9cc3ff'},
  {cat:'ai', title:"RAG 是什么", desc:"开卷考试、向量检索、拼提示词再生成", path:'rag/landscape.html', dur:72, color:'#7cc7ff'},
  {cat:'cs', title:"线程池是什么", desc:"银行柜台比喻、任务流转、7 个参数、拒绝策略", path:'thread-pool/landscape.html', dur:80, color:'#a3e36b'},
  {cat:'psy', title:"积极心理学", desc:"从修补问题到培养优势、PERMA、品格优势、3 个练习", path:'positive-psychology/landscape.html', dur:72, color:'#ff8fb1'},
  {cat:'ai', title:"Opus 5.5 是怎么做出视频的", desc:"不生成像素，而是写代码；draw(t)、逐帧截图、自我检查", path:'opus-video/landscape.html', dur:76, color:'#ffcc66'},
  {cat:'cs', title:"MySQL 的 MVCC", desc:"隐藏列、undo 版本链、ReadView、RC 与 RR", path:'mysql-mvcc/landscape.html', dur:80, color:'#4dd0e1'},
  {cat:'cs', title:"按下回车后发生了什么", desc:"DNS、TCP 与 TLS 握手、HTTP 请求响应、浏览器渲染", path:'http-request/landscape.html', dur:80, color:'#e879f9'},
  {cat:'cs', title:"TCP 三次握手", desc:"为什么是三次、四次挥手、重传与窗口、SYN 洪水", path:'tcp-handshake/landscape.html', dur:80, color:'#facc15'},
  {cat:'cs', title:"数据库索引：为什么是 B+ 树", desc:"磁盘 IO、B+ 树查找、回表与覆盖索引、最左前缀", path:'bplus-tree/landscape.html', dur:80, color:'#fb923c'},
  {cat:'cs', title:"事务与 ACID", desc:"undo log、redo log 与 WAL、隔离级别、一致性", path:'transaction-acid/landscape.html', dur:80, color:'#34d399'},
  {cat:'cs', title:"Redis 缓存", desc:"为什么快、数据类型、旁路缓存、穿透击穿雪崩", path:'redis-cache/landscape.html', dur:80, color:'#ef5350'},
  {cat:'ai', title:"Embedding 向量", desc:"语义空间、向量运算、对比学习、余弦相似度", path:'embedding/landscape.html', dur:80, color:'#818cf8'},
  {cat:'cs', title:"消息队列", desc:"解耦异步削峰、Kafka 分区、不丢不重有序", path:'message-queue/landscape.html', dur:84, color:'#38bdf8'},
  {cat:'ai', title:"Function Calling 与 MCP", desc:"工具调用五步、工具设计、MCP 架构与安全", path:'function-calling-mcp/landscape.html', dur:80, color:'#f472b6'},
  {cat:'cs', title:"CAP 与 BASE", desc:"分区时 C 与 A 二选一、三选二的误解、最终一致", path:'cap-theorem/landscape.html', dur:80, color:'#14b8a6'},
  {cat:'cs', title:"限流算法", desc:"固定窗口、滑动窗口、漏桶、令牌桶，分布式限流", path:'rate-limiting/landscape.html', dur:80, color:'#c084fc'},
  {cat:'ai', title:"Prompt 工程与结构化输出", desc:"好提示词的结构、少样本、思维链、JSON 输出与校验", path:'prompt-engineering/landscape.html', dur:80, color:'#fdba74'},
  {cat:'cs', title:"MySQL 的锁", desc:"S/X 锁、记录锁·间隙锁·临键锁、死锁", path:'mysql-lock/landscape.html', dur:80, color:'#fb7185'}
];
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur = 'all';
try { cur = new URLSearchParams(location.search).get('cat') || 'all'; } catch (e) {}
function render(){
  const tabs = [{id:'all', name:'全部', n:VIDEOS.length}, ...CATS.map(c => ({...c, n:VIDEOS.filter(v => v.cat === c.id).length}))];
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    `<button class="tab${t.id === cur ? ' on' : ''}" data-id="${t.id}">${esc(t.name)}<span class="n">${t.n}</span></button>`).join('');
  document.getElementById('list').innerHTML = CATS.filter(c => cur === 'all' || c.id === cur).map(c => {
    const vs = VIDEOS.filter(v => v.cat === c.id);
    if (!vs.length) return '';
    return `<section><h2>${esc(c.name)} <small>${vs.length} 部</small></h2><div class="grid">` +
      vs.map(v => { const art = v.path.replace(/[^/]+$/, 'article.html');
        return `<div class="card" style="--accent:${v.color}"><b>${esc(v.title)}</b><span class="d">${esc(v.desc)}</span>` +
          `<div class="acts"><a class="play" href="${v.path}">▶ 看视频 · ${fmt(v.dur)}</a>` +
          (v.article === false ? `<a class="read off">📖 文章撰写中</a>` : `<a class="read" href="${art}">📖 读文章</a>`) + `</div></div>`; }).join('') +
      `</div></section>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { cur = b.dataset.id; render(); });
}
render();
</script>
</body>
</html>
